ن هذا الكتيب سيرشدك\nخالل مهام عملك اليومية ويساعدك لتقديم خدمات تطعيمية آمنة.\n\nاجعل هذا الدليل في متناول يدك\nاستفد منه يوميًا\nشاركه مع زمالئك\nوتذكر دائماً أن عملكم المشترك يحمي األرواح\n\nالطبعة األولى -ديسمبر 2025 5", "االفتتاحية\nيعتمد نظام التحصين في ليبيا على االلتزام اليومي من قبل الممارسين الصحين العاملين في\nمجال اللقاحات، إذ يؤثر مدى التزامهم باإلجراءات الصحيحة -بدءاً من تخزين اللقاحات بأمان\nوصوالً إلى إعداد جلسة التطعيم -بشكل مباشر على فاعلية الطعوم وسالمة كل جرعة يتم\nاستخدامها.\n\nيدعم هذا الكتيب القرارات اليومية، ويعزز المهارات العملية، ويوحّد اإلجراءات في جميع\nأنحاء البالد، وهو يتوافق -في ذلك -مع المركز الوطني لمكافحة األمراض في ليبيا، ومع نتائج\nتقييم اإلدارة الفعالة للقاحات، ومنهج التدريب على اإلدارة الموجّه للمستويات المتوسطة\n(مشرفي التطعيمات في البلديات)، مما يضمن الحصول على إرشادات واضحة، وعملية،\nومحدثة.\n\nالطبعة األولى -ديسمبر 2025 6", "الغرض من هذا الكتيب\nيقدم هذا الكتيب معلومات أساسية وإرشادات عملية لجميع العاملين في مجال اللقاحات في ليبيا،\nويهدف إلى توحيد اإلجراءات عبر جميع المرافق الصحية ومساعدة الموظفين في الحفاظ على فاعلية\nالطعوم، وإعداد جلسات تطعيم آمنة، وإدارة مخزونات الطعوم واإلمدادات بفعالية، واالستجابة\nلحاالت الخروج عن نطاق الحرارة الموصى بها، ومشاكل صيانة المعدات.\n\nويعتبر هذا الكتيب مكمالً لحزمة التدريب المنفذة بالتعاون بين المركز الوطني لمكافحة األمراض\nوالمكتب الوطني لمنظمة األمم المتحدة للطفولة (اليونيسف)، ويدعم تنفيذ أولويات تحسين منظومة\nالتحصين في ليبيا، بما في ذلك التوصيات والنتائج المستخلصة من تقييم اإلدارة الفعالة للقاحات،\nوالمراجعة الخاصة بالبرنامج الموسع للتطعيمات، والجرد المحدّث لسلسلة التبريد.\n\nالطبعة األولى -ديسمبر 2025 7", "من ينبغي عليه استخدام هذا\nالدليل؟\nهذا الكتيب موجّه للمجموعات التالية:\n\n❑ المطعّمين /مقدمي خدمات التطعيم\n❑ مشرفي البرنامج الموسع للتطعيمات\n❑ مساعدي المشرفين\n❑ مشرفي الحلقة الباردة /سلسلة التبريد\n❑ الفرق المنفّذة لجلسات التطعيم الخارجية (التي تستهدف الوصول ألماكن خارج التغطية)\n❑ المدربينّ\nسيستفيد من هذا الكتيب أي موظف يعمل في مجاالت تداول اللقاحات أو تخزينها\nأو نقلها أو إعطائها للفئات المستهدفة.\n\nالطبعة األولى -ديسمبر 2025 8", "كيفية استعمال هذا الكتيب\nصُمم هذا الكتيب ليكون دليالً عملياً، يشرح كل فصل ما ينبغي القيام به أثناء األنشطة الروتينية\nمثل تخزين الطعوم، ومراقبة درجات الحرارة، واستالم اإلمدادات، وإدارة جلسة تطعيم، وإدارة\nالنفايات، وصيانة المعدات.\n\nويمكنك الرجوع إلى الكتيب:\n\n❑ قبل إجراء جلسة تطعيم\n\n❑ عند طلب وحساب مخزون الطعوم\n\n❑ أثناء زيارات اإلشراف الداعم\n\n❑ عند مواجهة مشاكل في درجة الحرارة أو المعدات\n\n❑ كجزء من التدريبات التنشيطية الروتينية\n\nيتبع هذا الكتيب معايير اإلدارة الفعالة للقاحات الخاصة بمنظمتي الصحة العالمية واليونيسف،\nوالدورة التدريبية على سلسلة التبريد وإدارة اللقاحات الخاصة باإلدارة المتوسطة (مشرفي\nالبلديات)، والتوجيهات التشغيلية للمركز الوطني لمكافحة األمراض في ليبيا.\nجميع اإلجراءات وإجراءات التشغيل القياسية وأدوات المساعدة في العمل مشتقة من دليل إجراءات\nالتشغيل القياسية النموذجي لإلدارة الفعالة للقاحات التابع لمنظمة الصحة العالمية، وتم تكييفها\nلتناسب سياق سلسلة اإلمداد في ليبيا، وظروف الطاقة، وأنواع المعدات، والتحديات التشغيلية\nالشائعة.\nيجب على الممارسين الصحيين العاملين في مجال اللقاحات استخدام هذا الكتيب كمرجع وطني\nللتخزين والمناولة والنقل واإلعطاء الصحيح للقاحات عبر جميع المرافق الصحية والبلديات في\nالبالد.\n\nالطبعة األولى -ديسمبر 2025 9"]}, {"id": "supply", "title": "سلسلة إمداد اللقاحات في ليبيا", "emoji": "🚚", "pages": ["01.\nسلسلة إمداد اللقاحات في ليبيا\n\nيشرح هذا القسم كيفية نقل اللقاحات عبر سلسلة اإلمداد في ليبيا، مما يساعد كل عضو في\nالفريق على إدراك أهمية دوره في حماية فاعلية الطعم.\nكما يشرح هذا القسم النظام الذي يقوده المركز الوطني لمكافحة األمراض، والمسؤوليات على كل\nمستوى، والمعدات المستخدمة في جميع مراحل سلسلة التبريد /الحلقة الباردة.\n\nاألهداف التعليمية\nبنهاية هذا القسم من الكتيب، سيتمكن العاملون في مجال اللقاحات من:\n✓ وصف كيفية نقل اللقاحات من المخزن الوطني للمركز الوطني لمكافحة األمراض إلى\nالبلديات والمرافق الصحية\n✓ تحديد مسؤولياتهم في الحفاظ على فاعلية الطعم أثناء االستالم والتخزين والمناولة\n✓ التعرف على أنواع معدات سلسلة التبريد الشائعة االستخدام في ليبيا\n✓ شرح كيف يمكن لنقاط الضعف في سلسلة اإلمداد أن تؤدي إلى حاالت الخروج عن نطاق\nدرجة الحرارة وبالتالي إهدار الطعوم\n\nالطبعة األولى -ديسمبر 2025 10", "سلسلة إمداد اللقاحات في ليبيا\n\n1.1 كيفية نقل اللقاحات في ليبيا اليوم )دورة اللقاحات في ليبيا(\n\nتتم إدارة سلسلة إمداد اللقاحات في ليبيا بالكامل من قبل المركز الوطني لمكافحة األمراض، ويعمل\nالنظام الحالي عبر ثالثة مستويات رئيسية :\n\nالمسؤوليات المستوى اإلداري\n\n• استالم جميع اللقاحات من المصانع المنتجة للقاحات.\nمخزن لقاحات المركز\n• تخزين اللقاحات في درجات حرارة مناسبة لكل لقاح\nالوطني لمكافحة\n• إعداد وإرسال الشحنات إلى البلديات\nاألمراض\n• اإلشراف على صيانة المعدات، وتطوير التدريب، ووضع\n(المستوى المركزي)\nبروتوكوالت التشغيل\nاستالم اللقاحات من المركز الوطني لمكافحة األمراض • مخازن اللقاحات\nتخزين الطعوم في غرف تبريد وثالجات مبطنة بالثلج • بالبلديات\nتوزيع اللقاحات على المرافق الصحية (في نطاق تغطيته) • (المستوى دون\nتقديم الدعم االحتياطي الطارئ والمساعدة اللوجستية للمرافق • الوطني)\nتخزين اللقاحات في ثالجات مبطنة بالثلج (ILRs )•\n• مراقبة درجات الحرارة مرتين يومياً\nالمرافق الصحية\n• إعداد وتنفيذ جلسات التطعيم\n(مستوى تقديم\n• االحتفاظ بسجالت دقيقة\nالخدمة)\n• رصد وإدارة اآلثار الجانبية المصاحبة للتطعيم واإلبالغ عنها\n• ضمان التخلص السليم من النفايات\nيقلل هذا النظام من عدد نقاط تبادل اللقاحات مما يعزز سالمة اللقاحات.\n\nنقاط ضعف سلسلة التبريد في ليبيا\n\nتعمل سلسلة إمداد اللقاحات في ليبيا في بيئة مليئة بالتحديات، حيث تشهد انقطاعات متكررة في\nالكهرباء، وتذبذبات في الطاقة، وعدم انتظام في توفر مصادر الطاقة االحتياطية مثل المولدات أو\nأنظمة الطاقة الشمسية.\n\nتعتمد العديد من المخازن البلدية والمرافق الصحية على طاقة الشبكة غير المستقرة، ويمكن أن يحد\nنقص الوقود من استخدام المولدات االحتياطية أثناء االنقطاعات الطويلة.\n\nالطبعة األولى -ديسمبر 2025 11", "سلسلة إمداد اللقاحات في ليبيا\n\nتزيد هذه الظروف من احتماالت ومخاطر الخروج عن نطاق درجة الحرارة ويمكن أن تُعرض\nفاعلية الطعم للخطر إذا لم يكن العاملون الصحيون متيقظين في تطبيق إجراءات سلسلة التبريد.\n\nيساعد فهم نقاط الضعف هذه الممارسين الصحيين في مجال اللقاحات على تطبيق إجراءات مراقبة\nأكثر صرامة، وتنفيذ إجراءات تصحيحية سريعة أثناء انقطاع التيار الكهربائي، واإلبالغ عن\nالمخاطر على الفور لمشرفي البلديات وفريق عمل المركز الوطني لمكافحة األمراض\n\n1.2 مسؤوليات العاملين في مجال اللقاحات\n\nبصفتك ممارساً صحياً تعمل في مجال للقاحات، فإن مسؤولياتك تتضمن التأكد ما يلي:\n✓ استالم اللقاحات بشكل صحيح والتحقق منها عند الوصول\n✓ تخزين الطعوم ضمن نطاقات درجة الحرارة الموصى بها في جميع األوقات\n✓ الحفاظ على مخزون الطعوم بأمان، وتنظيمه، وتدويره باستخدام مبدأ األولوية لألقرب انتهاًء\n(أول من ينتهي تاريخه، هو أول من يخرج)\n✓ مراقبة درجات حرارة سلسلة التبريد مرتين يومياً وتسجيلها بدقة\n✓ االستجابة لحاالت الخروج عن نطاق درجة الحرارة واإلنذارات واإلبالغ عنها على الفور\n✓ تتبع مخزون الطعوم بدقة باستخدام بطاقات المخزون والسجالت المحدثة\n✓ إعداد جلسات التطعيم وإجرائها بأمان\n✓ فصل النفايات والتخلص منها بشكل سليم وفقاً لإلجراءات الوطنية\n✓ اإلبالغ عن أي مشاكل تؤثر على سالمة اللقاح أو جودة تقديم الخدمة إلى مشرف البلدية\nوالمركز الوطني لمكافحة األمراض.\n\nمراقبة سلسلة التبريد نشاط مستمر يتطلب اليقظة الدائمة\nيجب أن تتم مراقبة درجة الحرارة يومياً وبشكل مستمر\nتذكر أن يقظتك وإدارتك للمواقف المختلفة ستحددان ما إذا كانت اللقاحات ستبقى ذات فاعلية، وما\nإذا كان األطفال سيحصلون على حماية فعالة أم ال.\n\n1.3 معدات سلسلة التبريد\nعبر البلديات والمرافق الصحية، قد تستخدم المعدات التالية:\n\nالطبعة األولى -ديسمبر 2025 12", "سلسلة إمداد اللقاحات في ليبيا\n\n• الثالجات المبطنة بالثلج )(ILRs\n• أجهزة استشعار درجة الحرارة لنظام • المجمدات /الفريزر (لعبوات التبريد/\nالمراقبة عن بعد لدرجة الحرارة أكياس الثلج)\n• مسجل درجة الحرارة لمدة 30أو 60يوماً • مثبتات الجهد الكهربائي\n• بطاقات مؤشر التجمد • صناديق التبريد\n• أوراق وسجالت تسجيل درجة الحرارة • حوامل اللقاحات /حافظات اللقاحات\n• عبوات الثلج /أكياس التبريد\nنظراً ألن بعض المرافق الصحية ونقاط التطعيم قد تواجه نقصاً في المعدات، فإن التنظيم الجيد\nواالستخدام الحذر للمعدات المتوفرة أمران ضروريان\n\n1.4 نظرة عامة على معدات سلسلة التبريد\nتعتمد كفاءة سلسلة التبريد على االستخدام الصحيح للمعدات وصيانتها. وتتسم إدارة معدات سلسلة\nالتبريد في الدول متوسطة النمو مثل ليبيا بعدة مظاهر منها عدم االلتزام بالترتيب الصحيح للقاحات\nداخل ثالجات الطعوم، وعدم انتظام تنفيذ الصيانات الدورية، وعدم استقرار الكهرباء، وعدم توافر\nالمعدات المعتمدة.\nويوضح هذا الجزء من الكتيب المعدات التي ستتعامل معها يوميًا وكيفية عمل كل منها.\n\nالمعدات المعتمدة وفق معايير منظمة الصحة العالمية :\n❖ معدات التخزين النشطة:\n• الثالجات المبطنة بالجليد )(ILRs\n• المجمدات العميقة /الديب فريزر (لتجميد العبوات المبردة، كما يتم استخدامها في\nتخزين لقاح شلل األطفال الفموي على المستوى المركزي فقط)\n• الثالجات العاملة بالطاقة الشمسية\n❖ معدات التخزين غير النشطة (التي ال تحتوي على مصدر لتغيير درجة حرارة مساحة\nالتخزين):\n• صناديق التبريد (تستخدم في نقل اللقاحات وفي التخزين المؤقت)\n• حوامل اللقاحات (تستخدم في جلسات التطعيم)\n• أكياس التبريد (عبوات الثلج التي تقوم بالتبريد)\n❖ أجهزة مراقبة الحرارة:\n• أجهزة تسجيل الحرارة لمدة 30أو 60يوًما\n• بطاقات مؤشر التجمد\nأنظمة مراقبة الحرارة اللحظية عن بُعد (RTMS )•\n\nالطبعة األولى -ديسمبر 2025 13", "سلسلة إمداد اللقاحات في ليبيا\n\n❖ الملحقات:\n• مثبتات الجهد الكهربائي\n• سجالت درجات الحرارة\n1.4.1.المعدات الكهربائية (الثالجات المبطنة بالثلج، المجمدات، غرف التبريد)\nتحافظ معدات سلسلة التبريد على اللقاحات ضمن درجات الحرارة الصحيحة في المرافق الصحية\nومخازن البلديات. وتستخدم ليبيا عدة أنواع من هذه المعدات، ويعتبر فهم كيفية عملها عنصراً هاما\nيساعد العاملين على حماية اللقاحات .\n\nما يجب معرفته وتطبيقه الخصائص المعدات\n• تحافظ على درجة حرارة بين °2+س\nاستخدامها كثالجة • و °8+س\nرئيسية للقاحات بطانة الثلج تساعد على استقرار • الثالجات المبطنة\nمراقبة درجات الحرارة • الحرارة أثناء انقطاع الكهرباء بالثلج )(ILRs\nبانتظام (مرتين يوميًا) (لفترات قصيرة) *األكثر استخداًما\nضمان التهوية الجيدة • تحتاج إلى مساحة تهوية ال تقل عن • في ليبيا\nتجنب التحميل الزائد • 10سم من كل جانب\n• يجب عدم تحميلها بشكل زائد\nدرجة الحرارة ( °15-إلى )°25-\nتستخدم في:\nيمنع تخزين اللقاحات المجمدات العميقة\noتجميد أكياس التبريد في كل\nداخل المجمدات على ( Deep\nالمستويات اإلدارية\nمستوى المرافق الصحية )Freezers\noتخزين لقاح شلل األطفال الفموي (\n)OPVفي المستوى الوطني فقط.\n• الفحص الفوري لشحنات\n• تخزين اللقاحات في المستويات\nالطعوم والمذيبات\nاإلدارية العليا والمتوسطة اإلدارية\nالتحقق من االلتزام • غرف التبريد\nالعليا والمتوسطة تعمل تحت مراقبة\nبدرجات الحرارة (المخازن الوطنية\nصارمة\nاتباع بروتوكول التداول • ودون الوطنية)\n• ال يسمح بالدخول إال لموظفي المركز\nالخاص بالمركز\nالوطني المدربين\nالوطني\n\nتتعرض هذه الوحدات لتقلبات واسعة في درجات الحرارة، وقد تفتقر ألجهزة المراقبة الداخلية، أو\nتُستخدم لتخزين الطعام -بالمخالفة للتعليمات -مما يزيد من احتماالت التلوث وعدم استقرار\nالحرارة.\nيجب على العاملين تقييم أي لقاحات منقولة من مرافق خاصة بعناية: فحص راصد صالحية قارورة\nاللقاح ( ،)VVMمراجعة سجالت الحرارة إنُوجدت، ووضع أي لقاحات مشتبه بها في صندوق\n\"الحجر\" حتى يتم فحصها وتقييمها من مشرف التطعيمات بالبلدية.\n\nالطبعة األولى -ديسمبر 2025 14", "سلسلة إمداد اللقاحات في ليبيا\n\n1.4.2 المعدات العاملة بالطاقة الشمسية\nتستخدم الثالجات التي تعمل بالطاقة الشمسية داخل بعض المرافق الصحية، وتقدم هذه الثالجات\nحالً مثالياً لمشكالت نقص الطاقة وتعتبر ضرورية في المناطق التي تعاني من عدم استقرار\nالكهرباء .\n\n• يجب الحفاظ عليها نظيفة وخالية من الغبار\nصا بصريًا أسبوعيًا أللواح الطاقة\n• تتطلب فحً\nالشمسية\n• يجب أال تكون مظللة باألشجار أو المباني أو\nأطباق األقمار الصناعية\n• تحتاج إلى بطاريات مشحونة جيدًا (إن كانت\nتعمل بالبطارية) أو ضمان تشغيل ذاتي لمدة 24\nساعة (إن كانت معتمدة على الطاقة الشمسية\nالمباشرة) للحفاظ على اآلداء الجيد خالل فترة\nالليل.\n\nيجب على العاملين الصحيين اإلبالغ عن:\n\n• ضعف أداء البطارية\n• تلف األلواح الشمسية\n• انقطاع الطاقة أثناء الطقس الغائم\nتكون المعدات الشمسية موثوقة بشرط صيانتها جيدًا، لكن أي خلل في الصيانة أو مراقبة\nاألداء قد يؤدي إلى تعرض اللقاحات للحرارة\n1.4.3 المعدات غير النشطة لسلسلة التبريد (صناديق التبريد، حوامل اللقاحات،\nالعبوات المبردة)\nيقصد بها المعدات العازلة غير الميكانيكية أي التي ال تحتوي على جزء نشط /ميكانيكي للتحكم في\nالحرارة أو توليد البرودة، بل تعتمد على مواد أخرى تم تخزين البرودة فيها مسبقاً مثل أكياس\nالتبريد.\n\nتوفر المعدات غير النشطة الحماية للقاحات أثناء النقل والجلسات الخارجية\n\nالطبعة األولى -ديسمبر 2025 15", "سلسلة إمداد اللقاحات في ليبيا\n\nمالحظات مهمة النقاط األساسية المكونات\n\n• الحفاظ على درجة الحرارة المطلوبة\nأثناء النقل لمسافات طويلة وفي حال\nفائض التخزين المركزي (أو\nالتخزين المركزي االحتياطي)\n• يجب أن يتم تبريدها قبل االستخدام\n• يجب إبقاء غطاء الحامل مغلقاً قدر صناديق التبريد/\n• تمنع االرتفاعات في درجات اإلمكان للحفاظ على البرودة صناديق\nالحرارة قبيل التحميل\n• يمكن استخدام صناديق التبريد الطوارئ/\n• يجب استخدام عبوات تبريد\nمهيئة. (األكبر حجماً) في جلسات التطعيم صناديق نقل\nالمتوقع أن يتم تقديم الخدمة فيها لعدد الطعوم\nكبير من األطفال\n• يمكن استخدام صناديق التبريد\n(األكبر حجماً) في جلسات التطعيم\nالمتوقع أن يتم تقديم الخدمة فيها لعدد\nكبير من األطفال\n\n• تُستخدم اثناء القيام بجلسة التطعيم\nيجب إبقاء غطاء الحامل مغلقًا قدر داخل المركز الصحي\nحوامل اللقاحات\nاإلمكان للحفاظ على البرودة • تُستخدم للنقل قصير المدة (مثل\nالجلسات الخارجية)\n\nيجب تكييف وتهئية العبوات\nالمجمدة حتى يُسمع صوت الماء توجد ثالث حاالت ألكياس التبريد:\nبداخلها قبل استخدامها مع • مجمدة صلبة أكياس التبريد\nاللقاحات، خاصة اللقاحات • ُمكيّفة /مهيئة (مذابة قليالً) )عبوات الثلج(\nالحساسة للتجميد (وذلك لمنع • مبردة\nأضرار التجميد)\n\n** تحذير:\n• وضع عبوات مجمدة مباشرة مع اللقاحات الحساسة للتجميد، مثل الخماسي، السداسي،\nّ\nالمعطل، يؤدي إلى تجميدها وإتالفها. المكورات الرئوية، شلل األطفال\n• يجب دائًما تهيئة أكياس التبريد قبل االستخدام.\nالطبعة األولى -ديسمبر 2025 16", "سلسلة إمداد اللقاحات في ليبيا\n\n1.4.4 المعدات اإلضافية (مثبت الجهد، األقفال، الوسائد العازلة…)\nتساعد هذه المعدات في الحفاظ على درجات حرارة مستقرة، وضمان سالمة اللقاحات في المرافق\nومخازن البلديات.\n\nنظرا لتكرار تقلبات الطاقة الكهربائية، وثغرات تغطية\nوفي ليبيا، تكتسب هذه المعدات أهمية خاصةً\nنظام المراقبة اللحظية، وتنوع ظروف التخزين عبر المرافق المختلفة\n\nالمعدات الملحقة تشمل :\n• مثبتات الجهد (لحماية الثالجات من التيار الكهربائي غير المستقر)\n• األجهزة اإللكترونية لقياس الحرارة لمدة 30يوًما (للمراقبة الدقيقة)\n• الوسائد العازلة (للحفاظ على الهواء البارد داخل حوامل اللقاح أثناء االستخدام)\n• سالل الثالجة (لضمان التدفق المنتظم للهواء)\n• األقفال ووسائل تأمين التخزين (لحماية اللقاحات)\nيساعد االستخدام السليم والفحص الروتيني وصيانة هذه المعدات الُمْلَحَقة في منع تجاوزات درجة\nالحرارة، وتقليل هدر اللقاحات، وتعزيز االمتثال لمعايير المركز الوطني لمكافحة األمراض\nومعايير اإلدارة الفعالة للقاحات\n\nالطبعة األولى -ديسمبر 2025 17"]}, {"id": "storage", "title": "التخزين الصحيح للقاحات", "emoji": "🧊", "pages": ["02.\nالتخزين الصحيح للقاحات\n\nيشرح هذا القسم ممارسات التخزين الصحيحة التي تحمي اللقاحات من التجمد، أو السخونة\nالزائدة، أو التلوث. وهو يقدم القواعد األساسية لترتيب ثالجات اللقاحات وقواعد التخزين اآلمن،\nويدمج كل المحتوى الهام من إجراءات التشغيل القياسية الخاصة بـ اإلدارة الفعالة للقاحات\n(الجزء الخاص بالتخزين (.))E1-E4\n\nاألهداف التعليمية\nبنهاية هذا القسم من الكتيب، سيتمكن العاملون في مجال اللقاحات من:\n✓ ترتيب اللقاحات بشكل صحيح داخل الثالجة المبطنة بالثلج وفقًا لمتطلبات\nالحساسية والتخزين .\n✓ تحديد اللقاحات الحساسة للتجميد، والحساسة للحرارة، والحساسة للضوء .\n✓ إجراء فحوصات التخزين اليومية لضمان حماية اللقاحات .\n✓ االلتزام بدرجات حرارة التخزين الصحيحة وتطبيق مبدأ األولوية في االستخد\nام لألقرب انتهاًء ( )FEFOللحفاظ على فاعلية الطعم.\n\nالطبعة األولى -ديسمبر 2025 18", "التخزين الصحيح للقاحات\n\n2.1 سلسلة التبريد وأهميتها\nاللقاحات هي منتجات بيولوجية حساسة تفقد فاعليتها إذا تعرضت للحرارة أو التجميد. ونظراً لعدم\nإمكانية استعادة الفاعلية المفقودة، فإن التخزين الصحيح هو أمر بالغ األهمية للتطعيم اآلمن.\n\nيجب تخزين اللقاحات:\n\n• بين 2+درجة مئوية و 8+درجات مئوية\n• في ثالجة مبطنة بالثلج، نظيفة ومنظمة\nاتباع مبدأ األولوية في االستخدام لألقرب انتهاًء في الصالحية (FEFO )•\n• بعيداً عن االتصال المباشر بلوح المبخر (عنصر التبريد) أو الجدران الداخلية للثالجة\n• الحفاظ على تدفق هواء كاف\n• محمية من أشعة الشمس المباشرة\n2.2 ترتيب الثالجة المبطنة بالثلج\n\nيعد التنظيم الصحيح لـ الثالجة المبطنة بالثلج ( )ILRأمراً ضرورياً لحماية اللقاحات من التعرض\nللحرارة والتجميد. لقد رصد تقييم فعالية إدارة اللقاحات في ليبيا مشكالت متكررة مثل االكتظاظ،\nووضع اللقاحات قريبة جداً من األسطح الباردة.\nيجب أن يتم ترتيب ثالجات اللقاحات دائماً بطريقة واضحة ومنظمة لضمان تدفق الهواء المناسب\nودرجات الحرارة اآلمنة.\n\nكيفية ترتيب اللقاحات بشكل صحيح في الثالجات المبطنة بالثلج\n• السالل العلوية: اللقاحات الحساسة للتجميد (خماسي\nالتكافؤ، سداسي التكافؤ، التهاب الكبد ب، لقاح شلل\nاألطفال المعطل/الميت، توكسيد الكزاز والدفتيريا،\nلقاح المكورات الرئوية المقترن، لقاح فيروس الورم\nالحليمي البشري، لقاح الروتا الفموي).\n• السالل السفلية: لقاح شلل األطفال الفموي واللقاحات\nالمجففة بالتجميد قبل اإلذابة (لقاح الدرن، لقاح الحصبة\nوالحصبة األلمانية، لقاح الحصبة والنكاف والحصبة\nاأللمانية)\n\nالطبعة األولى -ديسمبر 2025 19", "التخزين الصحيح للقاحات\n\n• مذيبات اللقاحات: يتم تخزينها داخل الثالجة، ويجب مطابقتها لنفس تشغيلة اللقاح.\n• يجب أن تكون السالل غير مكدسة، وذلك للسماح بتدفق الهواء.\n• احتفظ بـ صندوق للحجر يحمل عالمة واضحة \"ممنوع االستخدام\" ،في الجزء األسفل من\nالثالجة.\n\nال تضع اللقاحات أبداً:\nمالمسة للجدار الخلفي أو على أرضية الثالجة بشكل مباشر .\n\nتحذير -ال تضع اللقاحات أبداً في باب الثالجة\nال تحتوي الثالجات المبطنة بالثلج على أرفف أو حوامل تخزين في الباب، على عكس\nالثالجات المنزلية، وذلك ألن منطقة الباب هي األكثر دفئاً واألكثر تقلباً، ووضع اللقاحات\nهناك يمكن أن يؤدي إلى حاالت خروج عن نطاق درجة الحرارة وفقدان الفاعلية. هذا\nالتحذير موصى به من منظمتي الصحة العالمية واليونيسف.\n\n2.3 فحوصات التخزين اليومية\n\nالمراقبة الروتينية إلزامية. يجب إجراء هذه الفحوصات مرتين يومياً (الصباح وبعد الظهر):\n✓ التأكد من أن درجة الحرارة تتراوح بين 8-2درجات مئوية\n✓ التأكد من استقرار التيار الكهربائي\n✓ التحقق من إغالق باب الثالجة بشكل صحيح\n✓ فحص تراكم الصقيع\n✓ فحص أي قوارير لقاح تُركت خارج سلسلة التبريد\n\nتساعد هذه الفحوصات اليومية على اكتشاف العالمات المبكرة لتعطل المعدات، ومنع حاالت\nالخروج عن نطاق درجة الحرارة الموصى به لحفظ اللقاحات، وضمان االمتثال الكامل لمعايير\nالمركز الوطني لمكافحة األمراض ومنظمة الصحة العالمية واليونيسف.\n\n2.4 درجات حرارة التخزين الموصى بها\nيجب االحتفاظ باللقاحات ضمن نطاقات محددة لدرجة الحرارة للحفاظ على فاعليتها،\nالتعرض -ولو لفترات قصيرة -لدرجات حرارة خارج الحدود الموصى بها يمكن أن يضر\nباللقاحات بشكل دائم.\n\nالطبعة األولى -ديسمبر 2025 20", "التخزين الصحيح للقاحات\n\n❖ درجات الحرارة القياسية للتخزين\n• معظم اللقاحات: من +2°س إلى +8°س\n• •التّجميد( لعبوات الثلج ):من -15°س إلى -25°س\n• •حوامل اللقاحات وصناديق التبريد تُحافظ على درجة حرارة من +2°س إلى +8°س\n(باستخدام أكياس التبريد المهيئة)\n\n❖ ال تجمد هذه اللقاحات أبداً:\n\nاللقاحات التي تحتوي على الدفتيريا والكزاز • • لقاح الروتا الفموي\nوالسعال الديكي • لقاح فيروس الورم الحليمي البشري\nالتهاب الكبد الوبائي (ب) و (أ) • • توكسيد الكزاز والدفتيريا\nلقاح شلل األطفال المعطل • • خماسي التكافؤ\nلقاح المكورات الرئوية المقترن • • سداسي التكافؤ\n\nقد تبدو اللقاحات المجمدة طبيعية، ولكنها تصبح غير فعالة وخطيرة.\n\n❖ ممنوع تخزين اللقاحات في الفريزر على مستوى البلديات والوحدات التطعيمية: يقتصر استخدام\nالمجمد بشكل صارم على تحضير أكياس التبريد (عبوات الثلج الُمجمدة فقط ).وال تخزن ليبيا أي\nلقاح عند درجة حرارة -20باستثناء لقاح شلل األطفال الفموي )(OPVويكون ذلك في المستودع\nالوطني (فقط).\n\n❖ مذيبات الطعوم: يتم تخزينها بين 2+درجة مئوية إلى 8+درجات مئوية.\n2.5 اللقاحات مواد حساسة للغاية (حساسة للحرارة، والتجميد، والضوء)\n\nتختلف اللقاحات في كيفية تفاعلها مع الحرارة والبرودة والضوء. تساعدك معرفة هذه الحساسيات\nعلى تخزين قوارير اللقاح بأمان، واالستجابة لحاالت الخروج عن نطاق درجة الحرارة، وتعبئة\nحامل الطعوم بشكل صحيح.\n\nأ. اللقاحات الحساسة للتجميد\nتتضرر هذه اللقاحات بفعل التجميد، ولو لمرة واحدة.\nال تخزنها بالقرب من األجزاء األكثر برودة في الثالجة المبطنة بالثلج مثل ألواح التبريد والجدران\nالداخلية.\n\nتشمل اللقاحات الحساسة للتجميد في ليبيا ما يلي:\n\nالطبعة األولى -ديسمبر 2025 21", "التخزين الصحيح للقاحات\n\n• خماسي التكافؤ (الدفتيريا والكزاز • التهاب الكبد الوبائي (ب) و (أ)\n• والسعال الديكي -التهاب الكبد ب - لقاح الروتا الفموي\n• المستدمية النزلية من النمط )B لقاح المكورات الرئوية المقترن\n• توكسيد الكزاز والدفتيريا • لقاح فيروس الورم الحليمي البشري\n• لقاح شلل األطفال المعطل (الحقن) • سداسي التكافؤ\nعالمات التلف الناتج عن التجميد:\n• تجمد محتويات القارورة\n• تشقق القارورة\nً\n• بلورات ثلج صلبة (ال ترجها أبدا!)\n• تراكم الثلج داخل الثالجة\nال تضع اللقاحات الحساسة للتجميد مالصقة للجدار الخلفي أو أرضية الثالجة المبطنة\nبالثلج\n\nب. اللقاحات الحساسة للحرارة\nجميع اللقاحات حساسة للحرارة، لكن الطعوم األكثر حساسية للحرارة في ليبيا تشمل:\n• لقاح شلل األطفال الفموي (( )OPVحساس جداً للحرارة)\n• لقاح الدرن (( )BCGالمجفف بالتجميد)\n• اللقاحات التي تحتوي على الحصبة (الثنائي الفيروسي والثالثي الفيروسي)\nلتجنب التأثير السلبي للحرارة على هذه الطعوم:\n• أبق حوامل الطعوم مغلقة\n• تجنب تعريض حوامل الطعوم ألشعة الشمس\n• تنتهي صالحية اللقاحات المذابة بعد 6ساعات أو بنهاية جلسة التطعيم أيهما أقرب\nج. اللقاحات الحساسة للضوء\nبعض اللقاحات تتعرض للتدهور( التلف )عند تعرضها للضوء .\n\nتشمل هذه القائمة في ليبيا :\n\n• لقاح الدرن )(BCG\n• اللقاحات المحتوية على لقاح الحصبة\n• اللقاحات المحتوية على لقاح الحصبة األلمانية\nالطبعة األولى -ديسمبر 2025 22", "التخزين الصحيح للقاحات\n\nإجراءات الحماية :\n\n• االحتفاظ بقوارير اللقاح في عبواتها الداخلية\n• تجنب أشعة الشمس المباشرة أثناء جلسة تطعيم خارجية\n• االحتفاظ بالقوارير دائماً داخل حامل الطعوم /صندوق التبريد\n2.6 إدارة الصالحية ومبدأ األولوية في االستخدام لألقرب انتهاءاً\nتحمي اإلدارة الفعالة لصالحية اللقاحات من هدر الطعوم الذي يمكن تجنبه. يجب مناولة /استخدام\nجميع اللقاحات باتباع مبدأ \"األولوية في االستخدام تكون للقارورة األقرب انتهاًء (أول من ينتهي\nتاريخه هو أول من يخرج لالستخدام ،)FEFO-ويضمن هذا المبدأ استخدام القوارير ذات تواريخ\nانتهاء الصالحية األقرب أوالً.\nيجب على العاملين في مجال اللقاحات فحص تواريخ انتهاء الصالحية ومراحل راصد صالحية\nاللقاح ( )VVMأثناء كل عملية جرد للمخزون، وقبل إعداد جلسة التطعيم، وقبل إعادة القوارير إلى\nالثالجة. كما يجب االحتفاظ باللقاحات ذات التواريخ القصيرة على أرفف تحمل عالمات واضحة\nلتسهيل االستخدام ذي األولوية. ويجب إزالة القوارير منتهية الصالحية أو التالفة أو المشتبه فيها\nعلى الفور من المخزون القابل لالستخدام، ووضعها في صندوق الحجر، وتوثيقها وفقاً إلجراءات\nالمركز الوطني لمكافحة األمراض.\nيؤدي التطبيق المتسق لمبدأ األولوية لألقرب انتهاًء مع مراعاة درجة راصد صالحية القارورة إلى\nتقليل الهدر، ويضمن بقاء اللقاحات فعالة، ويدعم االمتثال لمعايير اإلدارة الفعالة للقاحات الخاصة بـ\nمنظمة الصحة العالمية واليونيسف.\n\n2.7 اختبار الرج\nيمكن أن تتضرر اللقاحات الحساسة للتجميد بشكل دائم عند تعرضها لدرجات حرارة أقل من 2+\nدرجة مئوية. يدمر التجميد فاعلية الطعم لهذه اللقاحات، وال يمكن رؤية الضرر بالعين المجردة.\nنظرا ألن ليبيا تشهد انقطاعات متكررة للتيار الكهربائي، وتقلباً في الجهد، وانخفاضاً عرضياً في\nدرجات حرارة الثالجات المبطنة بالثلج إلى ما دون النطاق اآلمن، يجب أن يكون العاملون في\nمجال اللقاحات متيقظين لخطر التجمد في جميع األوقات\n\nاختبار االهتزاز (الرج) هو إجراء متخصص يُستخدم للتأكد مما إذا كان اللقاح الحساس للتجميد قد\nتضرر بسبب التجمد. يجب أن يتم إجراؤه فقط من قبل المشرفين المدربين أو فنيي سلسلة التبريد في\nالمركز الوطني لمكافحة األمراض.\n\nال يُسمح للممارسين الصحيين العاملين في مجال اللقاحات بإجراء اختبار الرج، ويقتصر دورهم\nعلى التعرف على عالمات التحذير من التجمد واتخاذ إجراءات وقائية فورية؛ مثل وضع اللقاح\nالمشتبه به في الحجر واإلبالغ عن الحدث.\n\nالطبعة األولى -ديسمبر 2025 23", "التخزين الصحيح للقاحات\n\n❖ اللقاحات الحساسة للتجميد تشمل :\n• الخماسي (الدفتيريا-الكزاز-السعال الديكي-التهاب الكبد ب-المستدمية النزلية من النوع ب)\n• السداسي\n• التهاب الكبد (ب) و (أ)\n• شلل األطفال المعطل )(IPV\n• •المكورات الرئوية)(PCV\n• •الكزاز والدفتيريا)(Td\n• •فيروس الورم الحليمي البشري)(HPV\n• لقاح الروتا (الصيغه السائلة)\n❖ يجب أن يشتبه العاملون في مجال اللقاحات في التجمد عندما:\n• يُظهر مقياس حرارة الثالجة أو مسجل درجة الحرارة لمدة 30يوًما أقل من 2+درجة مئوية\n• يالمس الصقيع أو الثلج سالل اللقاح\nً\n• يُطلق (نظام المراقبة اللحظية عن بعد) إنذارا بالتجمد\n• يحدث انقطاع في التيار الكهربائي أو انخفاض في الجهد مؤخراً\n• تبدو قوارير اللقاح صلبة بشكل غير عادي أو باردة للغاية\n• تعمل الثالجة المبطنة بالثلج بشكل مستمر لفترات طويلة بدون صيانة مما يهدد سالمة وحدة\nالتبريد\n\n❖ ما يجب على العاملون في مجال اللقاحات فعله\nإذا كان هناك احتمال حدوث تجمد ألحد اللقاحات الحساسة للتجميد، فيجب على الفور:\n• إزالة اللقاحات المتضررة على الفور ووضعها في صندوق الحجر عند درجة حرارة 2+إلى\n8+درجة مئوية\n• وضع عالمة واضحة\" :ممنوع االستخدام -يشتبه في التجمد\".\n• عدم رج القارورة أو محاولة إجراء أي اختبار.\n• عدم التخلص من اللقاح.\n• تسجيل الحادث في مخطط درجة الحرارة.\n• تسجيل القارورة (القوارير) في سجل الحجر.\n• إبالغ مشرف سلسلة التبريد في البلدية أو نقطة االتصال في المركز الوطني لمكافحة األمراض\nعلى الفور.\n\nالطبعة األولى -ديسمبر 2025 24", "التخزين الصحيح للقاحات\n\n❖ ما سيفعله المشرفون (وليس العاملون الصحيون في نقاط تقديم الخدمة)\nسيقوم مشرفوا البلديات المدربون (فقط) بما يلي:\n• مراجعة بيانات درجة الحرارة وسبب الخروج عن النطاق\n• إجراء اختبار الرج وفقاً لتعليمات منظمة الصحة العالمية/اليونيسف\n• مقارنة القارورة المشتبه بها بقارورة تحكم\n• البت فيما إذا كان اللقاح ال يزال قابالً لالستخدام أم يجب التخلص منه\n• تحديث سجل الهدر وسجل المخزون وفقاً لذلك\nالرسالة الرئيسية للعاملين في مجال اللقاحات:\n\"ال يقوم متداولوا اللقاحات بإجراء اختبار الرج أبداً، بل يقومون بتمييز اللقاحات،\nووضعها في الحجر، واإلبالغ عنها، واالنتظار حتى يتحقق المشرف منها\".\n\nتضمن هذه التعليمات سالمة اللقاح، وتمنع استخدام اللقاحات المتضررة من التجمد،\nوتتوافق بشكل كامل مع توجيهات منظمة الصحة العالمية واليونيسيف بشأن اإلدارة\nالفعالة للقاحات، كما تتوافق مع الحزمة التدريبية المنفذة بالتعاون مع المركز الوطني\nلمكافحة األمراض في ليبيا.\n\nالطبعة األولى -ديسمبر 2025 25"]}, {"id": "temp", "title": "مراقبة درجة الحرارة", "emoji": "🌡️", "pages": ["03.\nمراقبة درجة الحرارة\n\nأظهر تقييم فعالية إدارة اللقاحات في ليبيا ضعفاً في تسجيل درجات الحرارة، وعدم االستجابة\nالمناسبة لتجاوزات درجات الحرارة، وهي فجوات رئيسية.\n\nيشرح هذا القسم أهمية مراقبة الحرارة وكيفية تطبيق إجراءات التحكم في درجات الحرارة بشكل\nمتسق. كما يصف هذا القسم كيفية قياس وتسجيل واالستجابة للتغيرات في درجة الحرارة للحفاظ\nعلى فاعلية اللقاحات دائًما.\n\nاألهداف التعليمية\nبنهاية هذا القسم من الكتيب، سيتمكن العاملون في مجال اللقاحات من:\n✓ قياس وتسجيل درجات الحرارة باستخدام مقاييس الحرارة، ونظام المراقبة اللحظي عن بعد(\nRTMS).\n✓ تحديد وتصنيف تجاوزات درجة الحرارة، واتخاذ اإلجراءات التصحيحية بشكل فوري.\n✓ توثيق حاالت التجاوز وتصعيد الحاالت وفقاً\nلإلجراءات المقررة من المركز الوطني لمكافحة األمراض.\n✓ تفسير مراحل راصد صالحية قارورة اللقاح ( )VVMلتحديد ما إذا كانت اللقاحات آمنة\nلالستخدام.\n\nالطبعة األولى -ديسمبر 2025 26", "مراقبة درجة الحرارة\n\n3.1 لماذا تعتبر مراقبة درجات الحرارة أمراً حيويا؟\nيمكن أن تفسد اللقاحات /تفقد فعاليتها عن طريق :\n• الحرارة الزائدة\n• التجمد\n• التقلبات الحرارية (عدم االستقرار الحراري)\nبعض التلف يكون مرئيًا مثل، القوارير المتجمدة، بينما يكون معظمه غير مرئي. لذلك، فإن\nالمراقبة الدقيقة لدرجة الحرارة أمر ضروري .\n\n3.2 أنواع أجهزة مراقبة درجة الحرارة\nقد تتعامل أثناء عملك في مجال الطعوم مع :\n\n30-day temperature loggers RTMS sensors\nمسجالت درجة الحرارة لمدة 30يوًما حساسات نظام المراقبة اللحظي عن بعد لدرجة\nللحصول على سجل مفصل ومستمر الحرارة ..تُستخدم في المخازن الرئيسية\nلدرجة الحرارة للحصول على تنبيهات بشكل مبرمج في الوقت\nالفعلي (المراقبة اللحظية)\n\nأجهزة تسجيل درجة الحرارة لمدة 30و 60يوًما )(30DTR and 60DTR devices\nتسجل وتخزن درجات حرارة الثالجة تلقائيًا لمدة 30أو 60يوًما، مما يتيح لمسؤولي التعامل مع\nاللقاحات والمشرفين اكتشاف تجاوزات درجة الحرارة التي قد ال تظهر في القراءات اليدوية\nاليومية.\nمستمرا لدرجة الحرارة، وهو أمر ضروري لمراقبة أداء سلسلة التبريد فيً توفر هذه األجهزة سجالً\nليبيا.\n\nبطاقات /مؤشرات التجميد)(Freeze Tags\nهي مؤشرات صغيرة تستخدم لمرة واحدة وتوضح ما إذا كان اللقاح الحساس للتجميد قد تعرض\nلدرجات حرارة أقل من الصفر ألكثر من 60دقيقة.\nتشير بطاقة التجميد المستحثة (التالفة) إلى أن اللقاح قد تعرض للتلف بسبب التجميد ويجب عزله\nواإلبالغ عنه وفًقا إلجراءات المركز الوطني لمكافحة األمراض، وال تغني بطاقات التجميد عن\nضرورة قراءات درجة الحرارة مرتين يوميًا\n\nالطبعة األولى -ديسمبر 2025 27", "مراقبة درجة الحرارة\n\nحسب وظيفته صحيح جهازبشكل كل قراءة يجب\n\n3.3 تسجيل درجة الحرارة اليومي\nيعد التسجيل الدقيق لدرجة الحرارة أحد أهم المهام ألي مسؤول يتعامل مع اللقاحات. وقد رصد\nتقرير تقييم فعالية إدارة اللقاحات في ليبيا فجوات في توثيق درجات الحرارة، وتأخير في التسجيل،\nومحدودية في التواصل الرأسي وتصعيد مشكالت درجة الحرارة. ال شك أن التسجيل الصحيح\nلدرجات الحرارة يساعد في اكتشاف المشكالت، وحماية فاعلية اللقاح، وضمان االمتثال لمعايير\nالمركز الوطني لمكافحة األمراض ومعايير منظمة الصحة العالمية واليونيسيف إدارة اللقاحات\nبفعالية.\n\nكيفية قياس درجة الحرارة\n• كيفية قياس درجة الحرارة\n• بالنسبة لألجهزة االلكترونية (تسجيل درجة الحرارة لمدة 30و 60يوماً)\n• اقرأ درجة الحرارة الحالية، وتحقق من وجود أي رموز إنذار أو تحذيرات بوجود تجا\nوزات لألعلى أو األسفل.\n\nمتى يتم القياس؟\n• مرتين يوميًا (صباًحا ومساًء /عند بداية الدوام وعند نهايته).\n• فور عودة التيار الكهربائي (ال تفتح الباب أثناء االنقطاع إال عند الضرورة) .\nمالحظة: ال تفتح الباب أثناء انقطاع التيار. يؤدي هذا إلى فقدان الهواء البارد. تحقق من الشاشة\nالخارجية أوالً .\n• عند استالم أو نقل اللقاحات .\n• بعد أي إنذار صادر عن نظام RTMSأو جهاز DTR. 30\nأين يتم التسجيل؟\nاستخدم الرسم البياني لمراقبة الحرارة) ، (Temperature Monitoring Chartمع التأكد من\nأنه :\n\nالطبعة األولى -ديسمبر 2025 28", "مراقبة درجة الحرارة\n\n• نظيف .\n• مقروء وواضح .\n• ُمكتمل لكل يوم من أيام الشهر .\n• ُمراَجع من قِبَل المشرف أثناء الزيارات .\nما الذي يجب مراقبته؟\n• درجات الحرارة خارج النطاق المسموح من 2+إلى 8+درجة.\n• فجوات أو إدخاالت (قراءات) مفقودة.\n• انخفاض مفاجئ في درجة الحرارة (خطر التجمد).\n• انجراف تدريجي صعودًا (عطل محتمل في ثالجة تخزين اللقاحات).\n• إنذارات متكررة بتجاوز الحد األدنى أو األقصى.\nلماذا نعتبر هذا األمر مهم؟\nقد يؤدي التسجيل غير الصحيح لدرجة الحرارة إلى ما يلي :\n• تجاوزات في درجة الحرارة دون مالحظة .\n• تلف في اللقاحات .\n• جلسات تطعيم غير آمنة .\n• أداء ضعيف بمعايير تقييم فعالية إدارة اللقاحات .\n• فقدان إمدادات اللقاح بسبب تعطل المعدات .\n\nيساهم التوثيق المتسق والدقيق لدرجة الحرارة بشكل مباشر في تحسين أداء سلسلة التبريد في\nليبيا ويضمن فعالية اللقاحات المستخدمة .\n\n3.4 االستجابة النحرافات (تجاوزات) درجة الحرارة\nعندما تنخفض درجات الحرارة أو ترتفع خارج النطاق المسموح به ( ،)8+-2+فقد يعني ذلك أن\nفاعلية اللقاحات في خطر.\n• إذا انخفضت الحرارة (أقل من :)2+يجب حماية اللقاحات الحساسة للتجميد.\n• إذا ارتفعت الحرارة (أكثر من :)8+تتطلب جميع اللقاحات حماية فورية.\nيجب وضع القوارير التي بها مشكلة في الَحجْ ر (يتم تجنيبها داخل الثالجة) وتسجيلها واإلبالغ\nعنها.\nيجب عدم التخلص من اللقاحات أبدًا دون توجيهات من المركز الوطني لمكافحة األمراض.\n\n3.5 إجراءات إضافية إلدارة انحرافات /تجاوزات درجة الحرارة\n3.5.1 تصنيف مدة تجاوز درجة الحرارة\nتؤثر تجاوزات درجة الحرارة على اللقاحات بشكل مختلف اعتمادًا على المدة التي بقيت فيها درجة\nالحرارة خارج النطاق اآلمن.\nيجب على مسؤولي التعامل مع اللقاحات التمييز بين التجاوزات قصيرة المدة والتجاوزات طويلة\nاألمد وذلك لتحديد االستجابة المناسبة.\n\nالطبعة األولى -ديسمبر 2025 29", "مراقبة درجة الحرارة\n\n3.5.2 التجاوز الحراري قصير المدة\nالتجاوز قصير المدة هو انحراف في درجة الحرارة يستمر أقل من 30دقيقة ويعود إلى النطاق\nالموصى به بعد إجراء تصحيحي.\nتشمل األمثلة:\n• االنقطاعات القصيرة في التيار الكهربائي.\n• ترك الباب مفتوًحا عن طريق الخطأ.\n• التقلب السريع في منظم الحرارة (الثيرموستات).\nفي حالة التجاوزات قصير المدة، اتخذ اإلجراء التصحيحي أوالً (على سبيل المثال، أغلق الباب،\nوأعد تشغيل الطاقة). ثم:\n• سجل الحدث في مخطط درجة الحرارة.\n• تحقق من أن جميع اللقاحات ال تزال ضمن مراحل راصد صالحية اللقاح ( )VVMالمقبولة.\n• راقب المعدات عن كثب لمدة 6-4ساعات التالية.\nال تتسبب التجاوزات القصيرة عادةً في تلف اللقاحات إذا تم تصحيحها على الفور، ولكن مع ذلك\nيجب توثيقها.\n\n3.5.3 التجاوز الحراري طويل األمد\nالتجاوز طويل األمد هو الذي يستمر أكثر من 60دقيقة (أو يؤدي إلى تشغيل إنذار )DTR30أو\nعندما تظل درجة الحرارة خارج النطاق ( )8+ - 2+على الرغم من اإلجراءات التصحيحية.\n\nتشمل األمثلة:\n• انقطاعات الكهرباء لفترة طويلة.\n• األعطال الميكانيكية في ثالجة تخزين اللقاحات.\n• نفاذ بطارية الطاقة الشمسية.\n• إنذارات نظام المراقبة اللحظية إذا لم يتم حلها في الوقت المناسب ( ’Unresolved RTMS\n.)Alarms\n\nفي حالة التجاوزات الحرارية المطولة:\nفورا (إذا كانت درجة الحرارة حرجة االرتفاع/االنخفاض) إلى صناديق تبريد أو\n• انقل اللقاحاتً\nبردةُمجَّهزة).\nحافظات لقاحُمعدَّة (باستخدام عبواتُمَّ\n• افصل اللقاحات الحساسة للتجميد وضعها في الَحجْ ر إذا اشتبه في تجمدها.\n• أبلغ المشرف البلدي والمسؤول عن المرفق.\n• استعد الستخدام نموذج تجاوز درجة الحرارة أو نموذج تسجيل الهدر بناًء على تعليمات\nالمشرف.\n\nالطبعة األولى -ديسمبر 2025 30", "مراقبة درجة الحرارة\n\nد تتسبب التجاوزات المطولة في تلف ال رجعة فيه في اللقاحات ولذا يجب دائًما تصعيدها إلى\nالمستويات األعلى.\n\n3.5.4 دور المشرفين في المصادقة على اللقاحات التي تم تجنيبها (المحجورة)\n\nفورا في صندوق الَحجْ ر. يجب على\nعند االشتباه في تعرض لقاح للحرارة أو التجميد، يجب وضعهً\nمسؤولي التعامل مع اللقاحات في مراكز التطعيم عدم اتخاذ قرارات بمفردهم بشأن ما إذا كان يمكن\nاستخدام هذه اللقاحات أو إعادتها إلى المخزون، أم يجب التخلص منها.\nتشمل مسؤوليات المشرف (مشرف البلدية) ما يلي:\n• مراجعة سجالت درجة الحرارة وأي إنذارات لنظام المراقبة اللحظي .RTMS\n• تقييم سبب ومدة التجاوز.\n• فحص قوارير اللقاحات المحجورة بحثًا عن عالمات التجميد أو التلف.\n• إجراء أو طلب اختبار الرج ( )Shake Testإذا اشتبه في تلف التجميد.\nهدرا.\n• تأكيد ما إذا كان ينبغي إعادة اللقاحات إلى المخزون القابل لالستخدام أو اعتبارهاً\n• تقديم القرار النهائي إلى فريق التطعيم على مستوى البلدية والبرنامج الموسع للتطعيمات.\n• التأكد من توثيق الحدث في نموذج تسجيل تجاوزات درجة الحرارة وفي بطاقات المخزون\nفقط المشرفون وأعضاء اإلدارة العليا المعينون من المركز الوطني لمكافحة األمراض لديهم سلطة\nالمصادقة على اللقاحات المحجورة.\n\n3.5.5 التوثيق المطلوب: نموذج تسجيل التجاوزات الحرارية وتحديث سجل\nالحَجْ ر\nيجب توثيق جميع تجاوزات درجة الحرارة بالكامل لضمان المساءلة والتتبُّع واالمتثال للمعايير\nالوطنية.\nيجب إكمال المستندات التالية:\n\nالطبعة األولى -ديسمبر 2025 31", "مراقبة درجة الحرارة\n\nمخطط مراقبة درجة الحرارة (Temperature Monitoring Chart)\n• سجل قراءة درجة الحرارة عند اكتشاف التجاوز.\n• أضف مالحظة قصيرة تشرح المشكلة.\n• أدرج اإلجراء التصحيحي المتخذ.\nودون تاريخ اإلدخال.\n• وقعّ\nنموذج تجاوز درجة الحرارة (Temperature Excursion Form)\nيجب إكمال هذا النموذج لجميع التجاوزات المطولة وأي حالة يشتبه فيها بتلف اللقاح. يشمل النموذج\nما يلي:\n• تاريخ ووقت الحادث.\n• تحديد هوية ثالجة تخزين اللقاحات أو الُمجّمد (كود الثالجة /رقم التشغيل).\n• درجة الحرارة عند االكتشاف.\n• مدة التجاوز (المقدَّرة أو المؤَّكدة).\n• اإلجراءات المتخذة (على سبيل المثال، نقل اللقاحات، التعديالت التي أجريت).\n• تفاصيل اللقاحات المحجورة.\n• تقييم المشرف والقرار النهائي.\n\nسجل الَحجْر (Quarantine Logbook)\n\nيجب تسجيل أي لقاح يتم نقله إلى صندوق الَحجْ ر في السجل أو دفتر قيد الَحجْ ر. يجب أن يشمل\nاإلدخال:\n• اسم اللقاح.\n• رقم تشغيلة اللقاح.\n• تاريخ انتهاء الصالحية.\n• سبب الَحجْ ر.\n• تاريخ ووقت الَحجْ ر.\n• القرار النهائي (للمشرف).\n\nتحديث سجالت المخزون (Stock Records Update)\n\nبمجرد اتخاذ المشرف للقرار، يجب تحديث بطاقات المخزون من أجل:\n• إعادة اللقاحات المعتمدة إلى المخزون القابل لالستخدام، أو\n• تسجيل الهدر بالنسبة للقاحات التي تم التخلص منها.\n\nيضمن التوثيق الدقيق أن يحافظ المركز الوطني لمكافحة األمراض على إشراف كامل على مخاطر\nالفاعلية وأن يتم تلبية متطلبات التتُّبع حسب تعليمات اإلدارة الفعالة للقاحات.\n\nالطبعة األولى -ديسمبر 2025 32", "مراقبة درجة الحرارة\n\n3.6 قواعد تفسير راصد صالحية قارورة اللقاح (مؤشر المراقبة)\nيساعد راصد صالحية قارورة اللقاح ( )VVMالممارسين الصحيين العاملين في مجال اللقاحات في\nتحديد ما إذا كانت القارورة قد تعرضت لكمية كبيرة من الحرارة ويجب التخلص منها.\n\nنظرا ألن ليبيا تشهد تقلبات متكررة في الكهرباء، وتأخيرات في النقل، ووقت سفر طويل بينً\nمخازن البلديات والمرافق الصحية، فإن تفسير مؤشر راصد صالحية القارورة ضروري لضمان\nاستخدام اللقاحات الفعالة فقط.\nيجب على كل مسؤول يتعامل مع اللقاحات فحص حالة الراصد /المؤشر قبل فتح القارورة، وأثناء\nجلسات التطعيم الخارجية، وفي نهاية كل جلسة . .\n\nيتكون الراصد /المؤشر من جزأين: حلقة خارجية مرجعية ومربع داخلي يتغير لونه كلما تعرض\nاللقاح للحرارة المتراكمة (تأثير تراكمي) .\nيمكن استخدام اللقاح فقط إذا كان المربع الداخلي أفتح لونًا من الحلقة الخارجية\n\nمراحل راصد/مؤشر صالحية قارورة اللقاح :\n\nالوصف المرحلة\nقابل لالستخدام\nالمربع الداخلي أفتح بكثير >--يمكن استخدام اللقاح\n\nقابل لالستخدام – يجب استخدامه في أقرب فرصة\nالمربع الداخلي أصبح أغمق، ولكنه ال يزال أفتح من الحلقة الخارجية\nبحيث يمكن تمييزه (استخدم هذه القوارير أوالً) >--يمكن استخدام\nاللقاح، ويجب إعطاء األولوية الستخدامه لتجنب الهدر. 2\nحدوث هذا التغير في درجة راصد الصالحية أكثر شيوعاً أثناء جلسات\nالتطعيم الخارجية (عند التواجد في الميدان حيث المساحات المفتوحة\nوالمعرضة للحرارة والشمس بعيدا عن الثالجات)\nال يُستخدم\n\nالمربع الداخلي هو نفس لون الحلقة الخارجية >--يجب التخلص من 3\nاللقاح وتسجيله كهدر ناتج عن التعرض للحرارة.\n⮽\nال يُستخدم\nالمربع الداخلي أغمق من الحلقة الخارجية >--يجب التخلص من اللقاح 4\nفورا.\nً\n\nالطبعة األولى -ديسمبر 2025 33", "مراقبة درجة الحرارة\n\nيجب عدم إعادة أي لقاح وصل إلى مرحلة غير مقبولة من مراحل راصد مراقبة صالحية اللقاح( ا\nلمرحلة الثالثة والرابعة )إلى ثالجة اللقاحات.\nيمكنك االطالع على مراحل راصد صالحية القارورة في ملحق الوسائل المساعدة: دليل رقم ثالثة :\n(مراحل راصد صالحية قارورة اللقاح).\nيجب عزل هذا اللقاح في حاوية آمنة وتسجيله في سجل الهدر.\nأثناء جلسات التطعيم الخارجية، يجب فحص راصد صالحية القارورة لكل قارورة في كل مرة يتم\nفيها فتح حامل اللقاحات، حيث إن ارتفاع درجات الحرارة والمسافات الطويلة يزيدان من خطر\nالتعرض للحرارة.\nيساعد التفسير الصحيح لراصد صالحية قارورة اللقاح على منع استخدام اللقاحات المتضررة\nبالحرارة، ويقلل من الهدر الذي يمكن تجنبه، ويتوافق مع إجراءات منظمة الصحة العالمية والمركز\nالوطني لمكافحة األمراض والتي تستهدف ضمان خدمات تطعيم آمنة.\n\nالطبعة األولى -ديسمبر 2025 34"]}, {"id": "stock", "title": "إدارة مخزون اللقاحات", "emoji": "📦", "pages": ["04.\nإدارة مخزون اللقاحات\n\nتضمن اإلدارة الفعالة للمخزون توفر اللقاحات دائًما، وتخزينها بأمان، واستخدامها قبل انتهاء\nصالحيتها.\n\nيوفر هذا القسم من الكتيب إجراءات بسيطة وموثوقة لمساعدة مسؤولي التعامل مع اللقاحات في\nالحفاظ على بطاقات مخزون دقيقة، ومنع نفاذ المخزون، وتقليل الهدر، واتباع نظام الطلب\nالموصى به من المركز الوطني لمكافحة األمراض. من خالل تطبيق هذه الخطوات كل شهر وبعد\nكل جلسة، فإنك تحمي جودة اللقاح وتضمن استمرارية خدمات التطعيم في مرفقك.\n\nاألهداف التعليمية\nبنهاية هذا القسم من الكتيب، سيتمكن العاملون في مجال اللقاحات من:\n✓ الحفاظ على بطاقات مخزون دقيقة للقاحات، والمذيبات، والمحاقن، وصناديق األمان.\n✓ إجراء تسوية المخزون الشهرية وتحديد التباينات.\n✓ حساب احتياجات اللقاح بناًء على االستهالك، ومستويات المخزون، ومتطلبات المخزون\nاالحتياطي (الرصيد اآلمن).\n✓ تطبيق تصنيف الهدر واإلبالغ عنه بما يتماشى مع متطلبات المركز الوطني لمكافحة\nاألمراض ومعايير منظمة الصحة العالمية.\n\nالطبعة األولى -ديسمبر 2025 35", "إدارة مخزون اللقاحات\n\n4.1 تسجيل المخزون\nتضمن سجالت المخزون الدقيقة ما يلي:\n• التوفر المستمر للقاحات.\n• تجنب نفاذ المخزون.\n• مراقبة الهدر.\n• التخطيط السليم.\n\nيجب على كل مرفق صحي االحتفاظ ببطاقات مخزون لما يلي:\n• اللقاحات\n• المذيبات (المخففات)\n• القطارات\n• المحاقن /السرنجات\n• صناديق األمان\n\nتُحدَّث بطاقات المخزون:\n• عند استالم المخزون.\n• قبل وبعد كل جلسة تطعيم.\n• في نهاية كل شهر.\n\n4.2 تسوية المخزون الشهرية\nكل شهر:\n• قم بإجراء عّد فعلي للمخزون (جرد شهري).\n• قارن األعداد بأرصدة بطاقة المخزون.\n• حدد االختالفات .\n• صحح ووقع.\n\nهذا الروتين يعزز المساءلة ويقلل األخطاء باتاحة الفرصة للتصحيح أوال بأول.\n4.3 حساب وطلب اللقاحات\nيجب أن تستند كميات الطعوم المطلوبة إلى:\n• االستهالك الشهري (الجرعات المستخدمة في الشهر الماضي).\n• الجلسات القادمة المخطط لها.\n• احتياجات السكان.\n• المخزون االحتياطي /الرصيد اآلمن (حسب توصيات المركز الوطني لمكافحة األمراض).\nالتحوط ألي تأخيرات في التسليم.\n• ّ\nالطبعة األولى -ديسمبر 2025 36", "إدارة مخزون اللقاحات\n\nلطلب الطعوم طبق المعادلة التالية\nالطعوم المطلوبة = (أ * - )1.25 ب\nحيث:\n(أ * :)1.25 الكمية المطلوبة ( )%100 = 1باإلضافة إلى المخزون االحتياطي (= 0.25\n.)%25\n(ب): ما هو متوفر لديك بالفعل.\n\nيقلل الطلب الصحيح من الهدر ويمنع النقص في المتاح من اللقاحات.\n\n4.4 الحد من الهدر\n\nلتقليل الهدر:\n• قم بجدولة الجلسات األسبوعية للقاحات الجماعية حسب الظروف وبعد مناقشة مشرف البلدية.\n• استخدم قاعدة أول من ينتهي تاريخه هو أول من يخرج لالستخدام (.)FEFO\n• ابذل الجهد في حفظ القوارير أثناء النقل.\n• راقب مؤشر صالحية قوارير اللقاح باستمرار.\n4.5 قياس وتسجيل درجات الحرارة\nتم وصف إجراءات قياس درجة الحرارة وتسجيلها بالتفصيل في القسم الثالث من هذا الكتيب (3.3)\nوالذي يوفر جميع التعليمات التي يجب على مسؤولي التعامل مع اللقاحات اتباعها، ويشمل ذلك\nكيفية قياس درجة الحرارة، ومتى يتم قياسها، وكيفية استخدام األجهزة اإللكترونية وأجهزة رصد\nالحد األدنى األقصى، ومكان توثيق القراءات، وعالمات اإلنذار المبكر التي يجب مراقبتها.\nيجب على مسؤولي التعامل مع اللقاحات الرجوع دائًما إلى هذا القسم للحصول على إرشادات دقيقة\nوكاملة حول مراقبة درجة الحرارة.\n\n4.6 أنواع الهدر، وأهمية اإلبالغ عنه\nالهدر هو جزء متوقع من خدمات التطعيم، ولكن يجب مراقبته بعناية لتجنب (الخسائر التي يمكن\nمنعها) وضمان (التخطيط الدقيق). أظهر التقرير الخاص بتقييم فعالية إدارة اللقاحات في ليبيا\nوالتقرير الخاص بالمراجعة الداخلية للبرنامج الموسع للتطعيمات عدة فجوات في توثيق الهدر، منها\nعدم اكتمال السجالت، وعدم اإلبالغ عن الهدر المرتبط بالتجاوزات، والخلط بين الخسائر التي\nيمكن تجنبها والتي ال يمكن تجنبها.\n\nالطبعة األولى -ديسمبر 2025 37", "إدارة مخزون اللقاحات\n\nلذلك، نوصي مسؤولي التعامل مع اللقاحات بضرورة تسجيل الهدر بجميع أنواعه بشكل مستمر،\nوتصنيفه بشكل صحيح، باتباع إرشادات منظمة الصحة العالمية واليونيسف والمركز الوطني\nلمكافحة األمراض.\n\nالهدر الذي ال يمكن تجنبه (الفَْقُد الُمَحتَُّم/\nالهدر الذي يمكن تجنبه\nالالزم)\nينتج عن التعامل أو التخزين أو التخطيط غير يحدث عندما ال يمكن استخدام اللقاحات\nالصحيح. يجب تقليله إلى الحد األدنى واإلبالغ ألسباب خارجة عن سيطرة المسؤول عن\nفورا. أمثلة تشمل : عنهً التعامل معها. أمثلة تشمل :\n• تجمد اللقاحات الحساسة للتجميد بسبب • اللقاحات التي تمت إذابتها ،(BCG\nإعدادات غير صحيحة لثالجة تخزين MMR) ،MRوالتي يجب التخلص منها\nاللقاحات أو ضعف مراقبة درجة الحرارة . بعد مدى زمني محدد (ست ساعات) .\n• التعرض للحرارة بسبب ترك حامل اللقاحات • وصول مؤشر صالحية قارورة اللقاح إلى\nمفتوًحا أو االستخدام غير السليم لعبوات المرحلة الثالثة أو الرابعة خالل جلسات\nالتبريد الُمجَّهزة . التطعيم الخارجية بالرغم من االلتزام\n• استخدام محلول مخفف خاطئ أو أرقام بممارسات سلسلة التبريد الصحيحة .\nتشغيالت غير متطابقة . • اللقاحات منتهية الصالحية( بشرط\n• اإلذابة غير الصحيحة للقاحات. استخدام اللقاحات األقرب انتهاءاً قبل\n• إعادة التركيب قبل األوان (فتح وإذابة غيرها ) FEFOالتي تم تخزينها والتعامل\nالطعوم قبل حضور الطفل) . معها بشكل صحيح .\n• عدم االلتزام بمبدأ استخدام الطعوم األقرب • الكسر أثناء النقل رغم الحفاظ على\nانتهاءاً أوالً (.)FEFO ظروف حفظ وتعبئة مناسبة .\n• الكسر الناجم عن سوء ممارسات التخزين أو\nالتعامل .\n• اللقاحات المتروكة خارج الثالجة بعد انتهاء\nالجلسة .\n\nكيفية اإلبالغ عن الهدر\nفورا في:\nيجب تسجيل جميع اللقاحات المهدورة -سواء كان يمكن تجنبها أو ال يمكن تجنبهاً -\n• سجل الهدر.\n• بطاقات المخزون للقاح المعني.\n• نموذج تجاوز درجة الحرارة، إذا كان الهدر نتيجة أحداث متعلقة بدرجات الحرارة (حرارة/\nتجمد).\n• تقرير ملخص الجلسة للقوارير المفتوحة وغير المستخدمة.\nفيما يخص الهدر الذي يمكن تجنبه، يجب على مسؤولي التعامل مع اللقاحات إخطار مشرف سلسلة\nالتبريد على مستوى البلدية والذي سيوثق اإلجراءات التصحيحية ويبلغ المركز الوطني لمكافحة\nاألمراض حسب االقتضاء.\nيساعد التصنيف واإلبالغ الصحيحان المركز الوطني لمكافحة األمراض على مراقبة جودة اللقاح،\nوتقليل الخسائر التي يمكن منعها، ودعم التنبؤ الدقيق عبر البرنامج الموسع للتطعيمات في ليبيا.\n\nالطبعة األولى -ديسمبر 2025 38"]}, {"id": "session", "title": "الإعداد لجلسات التطعيم وتنفيذها", "emoji": "🗓️", "pages": ["05.\nاإلعداد لجلسات التطعيم، وتنفيذها\n\nتضمن جلسات التطعيم الُمجهَّزة جيدًا حماية األطفال، والحفاظ على فاعلية اللقاح، وتقليل الهدر.\nفي ليبيا، غالًبا ما تواجه الجلسات الميدانية /الخارجية والثابتة تحديات مثل انقطاع التيار\nالكهربائي، وتأخير النقل، وعدم اتساق التوثيق\n\nيوجه هذا القسم مسؤولي التعامل مع اللقاحات عبر الخطوات األساسية قبل وأثناء وبعد كل\nجلسة، لضمان بقاء اللقاحات فعالة، وتلبية معايير السالمة، وتسجيل جميع البيانات بدقة. باتباع\nهذه اإلجراءات البسيطة في كل مرة، فإنك تساعد في تقديم خدمات تحصين آمنة وفعالة وعالية\n.الجودة في مجتمعك\n\nاألهداف التعليمية\nبنهاية هذا القسم من الكتيب، سيتمكن العاملون في مجال اللقاحات من:\n\n✓ تجهيز جميع اإلمدادات المطلوبة ومواد سلسلة التبريد قبل الجلسات الثابتة أو الخارجية\nفي الميدان.\n✓ إجراء جلسات تطعيم آمنة مع الحفاظ على ظروف سلسلة التبريد المناسبة.\n✓ إذابة اللقاحات بشكل صحيح وتطبيق السياسة الوطنية بشأن القوارير المفتوحة.\n✓ استكمال توثيق الجلسة وإدارة القوارير غير المستخدمة بالشكل المناسب.\nالطبعة األولى -ديسمبر 2025 39", "اإلعداد لجلسات التطعيم، وتنفيذها\n\n5.1 قبل الجلسةَجِ ّهز ما يلي:\n✓ اللقاحات الصحيحة.\nومبردة مسبقاً).\nّ ✓ المذيبات /المخّففات (متطابقة\n✓ المحاقن، وصناديق األمان، والقطن.\n✓ أكياس التبريد النظيفة والمهيئة.\n✓ منطقة تطعيم نظيفة.\n✓ وسادة رغوية (فوم) لحمل القوارير أثناء االستخدام.\n✓ سجالت التطعيم\n\n5.2 أثناء الجلسة\n\nق حامل اللقاحات مغلقًا قدر اإلمكان.\n• أبِ\n• تجنب تعريض القوارير ألشعة الشمس أو الحرارة.\n• أعد تركيب اللقاحات (إذابة اللقاحات) عند الحاجة فقط.\n• اتبع الحدود الزمنية الموصى بها لالستخدام.\n• حافظ بصرامة على ممارسات الحقن اآلمن.\n5.3 بعد الجلسة\n\n• عّد القوارير المتبقية.\nحّدِث سجالت المخزونً\n• فورا.\n• أعد القوارير غير المفتوحة إلى ثالجة اللقاحات (تحقق من راصد الصالحية /المرقاب أوالً).\n• يوصى باستخدام صناديق األمان حتى تصل إلى 75%من سعتها.\n• تخلص من النفايات بأمان.\n• سجل أي هدر.\nالطبعة األولى -ديسمبر 2025 40"]}, {"id": "safety", "title": "الحقن الآمن وإدارة النفايات", "emoji": "🧤", "pages": ["06.\nالحقن اآلمن وإدارة النفايات\n\nتحمي ممارسات الحقن اآلمنة المستفيدين، والقائمين على التطعيم، والمجتمع حيث يمكن أن\nيؤدي التخلص غير السليم من األدوات الحادة والنفايات الطبية إلى اإلصابات، والعدوى،\nوالمخاطر البيئية.\nفي ليبيا، أبرزت نتائج تقييم فعالية إدارة اللقاحات وزيارات اإلشراف الدورية الحاجة إلى\nاالستخدام المتسق للمحاقن ذاتية التعطيل، والتعامل الصحيح مع اللقاحات التي أُعيد تركيبها\n(إذابتها)، واإلدارة اآلمنة لصناديق األمان في جميع المرافق الصحية.\n\nيقدم هذا القسم خطوات بسيطة وموثوقة لضمان أن يكون كل حقن آمنًا، وأن يتم فصل وتخزين\nونقل كل بند من النفايات بشكل صحيح للتخلص منها، مما يحافظ على خدمات التطعيم آمنة\nوموثوقة .\n\nاألهداف التعليمية\nبنهاية هذا القسم من الكتيب، سيتمكن العاملون في مجال اللقاحات من:\n\n✓ اتباع ممارسات الحقن اآلمنة باستخدام المحاقن ذاتية التعطيل واإلجراءات الصحيحة إلذابة\nالطعوم الجافة.\n\n✓ فصل النفايات الحادة والنفايات العامة أثناء جلسات التطعيم.\n\n✓ إدارة صناديق األمان بأمان حتى التخلص النهائي منها من قبل الجهات المختصة.\n\nفورا وبشكل صحيح.\n✓ التعرف على األحداث الجانبية بعد التطعيم واإلبالغ عنهاً\n\nالطبعة األولى -ديسمبر 2025 41", "الحقن اآلمن وإدارة النفايات\n\n6.1 ممارسات الحقن اآلمن\nيجب على المتعاملين مع اللقاحات ضمان ما يلي:\n• استخدام المحاقن ذاتية التعطيل.\n• استخدام محقنةُمعقَّمة مخصصة لإلذابة (ال تستخدم أبدًا محقنة الخلط للحقن).\n• عدم إعادة تغطية اإلبر.\n• التخلص الفوري من األدوات الحادة.\n• التعامل الصحيح مع اللقاحات التي تمت إذابتها.\nيمنع الحقن اآلمن العدوى، ويحمي الموظفين والمرضى على حد سواء.\n\n6.2 فصل النفايات والتخلص منها\n• وضع األدوات الحادة مباشرة في صناديق األمان.\n• يجب إغالق صناديق األمان عند امتالء ثالثة أرباع سعتها.\n• يجب أن يكون التخزين المؤقت آمنًا وال يمكن للعامة الوصول إليه.\n• تقوم خدمات البلدية، بالتنسيق مع المركز الوطني لمكافحة األمراض، بجمع صناديق األمان\nوالتخلص منها.\n\nتساعد اإلدارة الصحيحة للنفايات في حماية البيئة وتمنع اإلصابات.\n\n6.3 التعرف على األحداث غير المرغوبة بعد التطعيم واإلبالغ عنها\n(ماذا تفعل عند حدوث أحداث جانبية)\nعلى الرغم من أن اللقاحات آمنة وفعالة، إال أن األحداث الجانبية التي تلي التحصين يمكن أن تحدث\nفي بعض األحيان. يجب أن يكون مسؤولو التعامل مع اللقاحات في المرفق الصحي وفي الميدان\nقادرين على التعرف على عالمات التحذير الرئيسية، ومدربين على تقديم الرعاية األساسية الفورية،\nواإلبالغ عن الحدث باستخدام اإلجراءات الوطنية.\nيساعد التعرف المبكر واإلبالغ السريع في حماية األطفال، والحفاظ على ثقة الجمهور، وضمان\nالتحقيق في الوقت المناسب من قبل المركز الوطني لمكافحة األمراض .\n\nمن األحداث الشائعة التي يجب على مسؤولي التعامل مع اللقاحات التعرف عليها:\nتفاعالت خفيفة مثل الحمى، واالحمرار، والتورم في موقع الحقن.\nخراج موضعي أو تورم مستمر.\nتفاعالت الحساسية بما في ذلك الطفح الجلدي أو الحكة.\nتفاعالت خطيرة تتطلب إحالة عاجلة.\n\nالطبعة األولى -ديسمبر 2025 42", "الحقن اآلمن وإدارة النفايات\n\nعالمات صدمة الحساسية المفرطة\n• صعوبة في التنفس.\n• تورم في الوجه.\n• طفح جلدي شامل.\n• تشنجات.\n• خمول غير عادي وعدم استجابة.\n• حمى شديدة ال تتحسن.\nما يجب على مسؤولي التعامل مع اللقاحات فعله (اإلجراءات الفورية):\n• حافظ على هدوئك وتأكد من سالمة الطفل.\n• قّدِم اإلسعافات األولية األساسية وفقًا إلرشادات المرفق الصحي (على سبيل المثال، وضع\nالطفل في وضع آمن أثناء التشنج، والحفاظ على مجرى الهواء مفتوًحا).\n• ال تُعطِ دواء (االستثناء الوحيد هو حقن الطفل باألدرينالين إذا اشتبهت في صدمة الحساسية\nالمفرطة بشرط أن تكون أنت مدربا على ذلك).\nفورا إلى أقرب مرفق صحيُمجَّهز إذا اشتبهت في رد فعل خطير.\n• إبدأ إجراءات تحويل الطفلً\nاإلجراء العالمات نوع التفاعل\n\nطمأنة الوالدين، النصح بسوائل إضافية /\nحمى، ألم في موضع\nباراسيتامول (إذا كانت سياسات البرنامج طفيف\nالحقن، احمرار\nالموسع للتطعيمات تسمح\n\n.1اجعل الطفل يستلقي بشكل مسطح.\nأرتكاريا، تورم بالشفاه\n.2أعطِ األدرينالين (عضليًا) شديد (صدمة\nوالوجه، صعوبة في\n.3اتصل بسيارة اإلسعاف ونفّذ برتوكول الحساسية)\nالتنفس، انهيار\nاإلحالة الطبية ألقرب مستشفى\n\nاالرتكاريا: هو طفح جلدي يظهر على شكل بثور أو بقع حمراء مثيرة للحكة، وتدل على رد فعل\nتحسسي\n\nما يجب على مسؤولي التعامل مع اللقاحات فعله (اإلبالغ والتوثيق):\n• أبلغ المسؤول عن المرفق أو مشرف المركز الوطني لمكافحة األمراض في أقرب وقت ممكن.\n• أكمل نموذج اإلبالغ عن األحداث الجانبية بتفاصيل دقيقة عن الحدث، ورقم تشغيلة اللقاح،\nوالوقت، واألعراض.\n• سجّل الحالة في سجل األحداث الجانبية الخاص بالمرفق.\nالطبعة األولى -ديسمبر 2025 43", "الحقن اآلمن وإدارة النفايات\n\nوتيرة (معدل) لون\nنوع الحاوية فئات النفايات\nالتجميع الحاوية والعالمات\n\nكيس بالستيكي\nقوي مانع للتسرب صفراء مع\nعند امتالء يوضع في حاوية رمز الخطر\nالنفايات\nثالثة أرباعها أو مرة (يجب أن تكون البيولوجي (يجب\nالكيميائية\nواحدة يوميًا على األكياس المخصصة تمييز النفايات شديدة\nوالصيدالنية\nاألقل. للنفايات شديدة العدوى العدوى بشكل إضافي\nقابلة للتعقيم بـ: شديدة العدوى)\nبالضغط).\nصفراء، ومميزة\nعند االمتالء\nصندوق أمان بـ: أدوات حادة مع\nحتى الخط المحدد أو النفايات الحادةُمقاِوم للثقب. رمز الخطر\nامتالء ثالثة أرباعها.\nالبيولوجي.\nصنَّفَة\nبنية، وُمَ النفايات الكيمي\nعبوات بالستيكية\nعند الطلب. برمز الخطر ائية والصيدالنية\nأو حاوية صلبة.\nالمناسب.\nعند امتالء كيس بالستيكي\nنفايات\nثالثة أرباعها أو مرة داخل حاوية أو حاوية\nسوداء الرعاية الصحية\nواحدة يوميًا على يتم تطهيرها\nالعامة\nاألقل. بعد االستخدام.\n\nاعتبارات خاصة بليبيا\n\n• أبرزت العديد من زيارات تقييم فعالية إدارة اللقاحات والزيارات اإلشرافية عدم اتساق\nاإلبالغ عن األحداث الضائرة وتأخر التواصل بين المرافق والبلديات.\n• في المناطق الميدانية ذات الدعم الطبي المحدود، يجب على مسؤولي التعامل مع\nاللقاحات ضمان اإلحالة السريعة والتواصل الفوري مع المشرفين.\n• يجب اإلبالغ عن جميع األحداث الجانبية الخطيرة في غضون 24ساعة إلى نقطة االت\nصال ( )Point Focalفي المركز الوطني لمكافحة األمراض.\n\nيدعم االلتزام باإلبالغ المبكر جهود النظام الوطني لترصد األحداث الجانبية ويضمن اتخاذ\nاإلجراءات التصحيحية عند الحاجة."]}, {"id": "maint", "title": "الصيانة الأساسية للمعدات", "emoji": "🔧", "pages": ["07.\nالصيانة األساسية للمعدات\n\nتعد معدات سلسلة التبريد الموثوقة ضرورية لحماية فاعلية اللقاحات. في ليبيا، يمكن أن تؤدي\nالمشكالت الشائعة مثل تقلبات الطاقة، وضعف كفاءة أبواب معدات التبريد ومساحات التخزين،\nوالتكون المفرط للجليد، وسوء التهوية، إلى خروقات متعددة في درجة الحرارة وإهدار اللقاحات.\nّ\n\nوضح هذا القسم الفحوصات الروتينية والبسيطة التي يمكن للعاملين الصحيين في مجال\nالتطعيمات القيام بها، ويشرح متى يجب االتصال بفنيي المركز الوطني لمكافحة األمراض للحصول\nعلى الدعم. باتباع خطوات الصيانة األساسية هذه، فإنك تساعد في منع تعطل المعدات والحفاظ\nعلى سالمة اللقاحات يوميًا.\n\nاألهداف التعليمية\nبنهاية هذا القسم من الكتيب، سيتمكن العاملون في مجال اللقاحات من:\n\n✓ أداء مهام الصيانة اليومية واألسبوعية والشهرية لثالجة تخزين اللقاحات.\n\n✓ تحديد عالمات عطل ثالجة تخزين اللقاحات، بما في ذلك مشكالت الطاقة أو الجليد أو التبريد\nغير المنضبط.\n\n✓ اتخاذ إجراءات وقائية فورية عندما يهدد عطل المعدات سالمة اللقاح.\n\n✓ تحويل مشكالت المعدات إلى قسم الحلقة الباردة التابع للمركز الوطني لمكافحة األمراض في\nالوقت المناسب.\n\nالطبعة األولى -ديسمبر 2025 45", "الصيانة األساسية للمعدات\n\n7.1 الصيانة التي يمكنك القيام بها\nدورا أساسًيا في الحفاظ على المعدات من\nيلعب الممارسين الصحيين العاملين في مجال اللقاحاتً\nخالل القيام بفحوصات روتينية بسيطة. يتم تفصيل جدول الصيانة اليومية واألسبوعية والشهرية\nفي القسم .7.3\n\n7.2 متى تطلب الدعم الفني؟\nاتصل بفنيي الصيانة ومشرف التطعيمات بالبلدية إذا:\n• تجاوزت ثالجة تخزين اللقاحات النطاق الحراري بشكل متكرر.\n• حدثت ضوضاء غير عادية.\n• ظهر تسرب للمياه.\n• تلف كابل الطاقة.\n• استمرت إنذارات نظام المراقبة اللحظي RTMS.\nاإلبالغ السريع يمنع فقدان اللقاحات\n\n7.3 مهام الصيانة األسبوعية والشهرية\nتساعد الصيانة الوقائية المنتظمة في الحفاظ على عمل معدات سلسلة التبريد بشكل صحيح، وتقلل\nمن تجاوزات درجة الحرارة، وتطيل من العمر االفتراضي لثالجات تخزين اللقاحات،\nوالُمجّمدات، والثالجات الشمسية.\n\nفي ليبيا، حيث تنتشر تقلبات الكهرباء، ودرجات الحرارة العالية في معظم المناطق، والبيئات\nالمتربة، يجب على العاملين في مجال اللقاحات إجراء فحوصات أسبوعية وشهرية روتينية\nواإلبالغ عن أي تشوهات على الفور إلى مشرف التطعيم بالبلدية.\n\nالطبعة األولى -ديسمبر 2025 46", "الصيانة األساسية للمعدات\n\n• نظف األجزاء الخارجية من الثالجات بقطعة قماش مبللة إلزالة الغبار\nالذي قد يقلل من كفاءة التبريد.\n• تحقق من مساحة التهوية ( 10سم كحد أدنى من جميع الجوانب) وتأكد من\nأن الثالجة ليست مدفوعة باتجاه الحائط.\n• نظم الجهد بحثًا عن عالمات ارتفاعافحص كابل الطاقة، والقابس، وُمِ ّ\nدرجة الحرارة أو التلف.\n• افحص موانع تسرب الباب باستخدام \"اختبار الورقة\" للتأكد من أنها نظيفة\nومرنة وتغلق بإحكام. المهام\nامسح الرطوبة داخل الثالجات وأزل التراكمات الصغيرة للجليد (الثلج). • األسبوعية\n• تأكد من عدم تخزين أي طعام أو مشروبات أو مواد غير اللقاحات\nوالمذيبات داخل ثالجة تخزين اللقاحات.\n• افحص درجة حرارة غرفة ثالجة تخزين اللقاحات، وتأكد من أنها باردة\nومظللة وجيدة التهوية.\n• اختبر مولّد الكهرباء، وتأكد من (التشغيل التلقائي عند فصل التيار\nالكهربائي وتوفر الوقود وسهولة الوصول إليه).\n• نظف الغبار من األلواح الشمسية.\n• قم بإجراء تنظيف داخلي كامل لثالجة تخزين اللقاحات (انقل اللقاحات إلى\nصندوق تبريد أوالً)، وأزل السالل وامسح األسطح بالماء الدافئ\nوالمنظفات الخفيفة (بدونُمبيّض).\n• أزل الجليد من حجرة التجميد إذا تجاوز سمك الجليد 5ملم أو إذا انخفضت\nكفاءة التبريد.\n• افحص أجهزة مراقبة درجة الحرارة ومستشعرات نظام المراقبة اللحظية\nلدرجات الحرارة للتأكد من أنها تعمل بشكل صحيح.\n• تحقق من استواء قاعدة الثالجة؛ إذ يمكن أن تتسبب الثالجة غير المتوازنة\nفي ضعف إغالق الباب وتقلبات في درجة الحرارة. المهام\nتحقق من أنظمة الثالجات الشمسية: تأكد من أن األلواح ليست مظللة/ • الشهرية\nافحص توصيالت البطارية ومستويات الشحن /أبلغ عن ضعف البطاريات\nفورا إلى البرنامج الموسع للتطعيمات. ً\n• راجع سجالت درجة الحرارة وحدد األنماط المتكررة مثل انخفاض\nدرجات الحرارة المتكرر (خطر التجميد) أو اإلنذارات المتكررة.\n• تأكد من استخدام صندوق الَحجْ ر ( )QUARANTINE boxبشكل\nصحيح وفصله عن المخزون القابل لالستخدام.\n• ودون إجراءات الصيانة، واألعطال المكتشفة، حّدِث سجل معدات المرفقّ ،\nوالتقارير التي تم كتابتها.\n\nالطبعة األولى -ديسمبر 2025 47", "الصيانة األساسية للمعدات\n\nمالحظات خاصة بليبيا\n• تعاني العديد من المرافق الليبية من انخفاض متكرر في الجهد الكهربائي، وعليه فإنه يجب\nاستخدامُمِ ّ\nنظمات الجهد مع جميع ثالجات تخزين اللقاحات والُمجّمدات لمنع التجميد أو\nتلف الضاغط (الكومبريسور).\nً\n• تتطلب الثالجات الشمسية في المناطق النائية تنظيفا منتظًما لأللواح الشمسية، حيث يقلل\nتراكم الغبار من الكفاءة بشكل ملموس.\n• يمكن أن يؤدي نقص الوقود إلى تعطيل استخدام الُمولِّد؛ لذلك، يجب على مسؤولي التعامل\nمع اللقاحات مراقبة درجات الحرارة بشكل متكرر أثناء فترات عدم استقرار الطاقة.\n• يجب أن تضمن المرافق الصحية تدفقًا جيدًا للهواء في غرف ثالجات تخزين اللقاحات،\nوتجنب تخزين الصناديق أو المواد حول الثالجة.\n\nتساعد الصيانة األسبوعية والشهرية في تقليل احتمالية تعطل المعدات وتدعم التخزين اآلمن\nللقاحات بما يتماشى مع متطلبات المركز الوطني لمكافحة األمراض ومعايير منظمة الصحة\nالعالمية إلدارة اللقاحات بفعالية.\n\nالطبعة األولى -ديسمبر 2025 48"]}, {"id": "superv", "title": "الإشراف الداعم", "emoji": "👥", "pages": ["08.\nاإلشراف الداعم\n\nيساعد اإلشراف الداعم مسؤولي التعامل مع اللقاحات على تعزيز مهاراتهم، وتحسين ممارساتهم\nاليومية، والحفاظ على خدمات تطعيم عالية الجودة.\nفي ليبيا، توفر زيارات اإلشراف من فرق المركز الوطني لمكافحة األمراض التوجيه، وتبرز\nمبكرا، وتعزز اإلجراءات الصحيحة إلدارة سلسلة التبريد والجلسات.\nً التحديات\n\nيشرح هذا القسم كيفية عمل اإلشراف، وماذا يجب أن يتوقعه العاملون في اللقاحات في\nالمستويات الطرفية أثناء الزيارات، وكيف يساهم التعلم المستمر في إدارة أقوى وأكثر فعالية\nللقاحات وحماية أفضل للمجتمعات.\n\nاألهداف التعليمية\nبنهاية هذا القسم من الكتيب، سيتمكن العاملون في مجال اللقاحات من:\n\n✓ فهم الغرض من اإلشراف الداعم وأثره في تحسين األداء.\n\n✓ تجهيز الوثائق المطلوبة وأدلة عمل سلسلة التبريد استعداداً لزيارات اإلشراف.\n\n✓ االنخراط في مناقشات التوجيه والتدريب لتعزيز الممارسات اليومية للتعامل مع اللقاحات.\n\n✓ تقديم المالحظات والمقترحات للمساهمة في تعزيز نظام التطعيمات التابع للمركز الوطني\nلمكافحة األمراض.\n\nالطبعة األولى -ديسمبر 2025 49", "اإلشراف الداعم\n\n8.1 دورُمشرفي المركز الوطني لمكافحة األمراض\nيساعد المشرفون في:\nتعزيز مهاراتك .\nالتحقق من ممارسات التخزين الجيدة .\nمراجعة مخططات درجة الحرارة وبطاقات المخزون .\nدعم حل المشكالت .\nتحسين جودة البيانات .\n\nاإلشراف هو دعم، وليس عقوبة\n\n8.2 التعلم المستمر\nيجب على العاملين في مجال اللقاحات:\n• مراجعة هذا الدليل بانتظام.\n• طرح األسئلة أثناء اإلشراف.\n• استشارة الزمالء.\n• إنعاش المعرفة قبل جلسات التطعيم الخارجية واألنشطة الميدانية.\n• المشاركة في التدريبات التنشيطية المقدمة من المركز الوطني لمكافحة األمراض واليونيسف.\n8.3 مساهمتك في بناء نظام أقوى\nتدعم ممارساتك اليومية بشكل مباشر خطة تحسين إدارة اللقاحات الوطنية في ليبيا ( )EVM-cIP\nوتساهم في خدمات تطعيم أكثر أماًنا وفعالية. تساعد اإلدارة عالية الجودة للقاحات في إعادة بناء\nالثقة وتضمن حصول األطفال على الحماية الكاملة.\n\n8.4 التجهيز لزيارة اإلشراف\nيكون اإلشراف الداعم أكثر فعالية عندما يكون مسؤولو التعامل مع اللقاحاتُمجَّهزين ولديهم جميع\nالمعلومات ذات الصلة جاهزة للمراجعة.\n\nفي ليبيا، أبرزت العديد من زيارات اإلشراف وجود توثيق غير مكتمل، ومخططات درجة حرارة\nمفقودة، وعدم تنظيم ثالجات تخزين اللقاحات بشكل جيد، مما يجعل من الصعب على المشرفين\nتحديد المشكالت وتقديم التوجيه في الوقت المناسب. يضمن التجهيز السليم أن تكون الزيارة مثمرة\nوأن تتم معالجة المشكالت قبل أن تتعرض فاعلية اللقاح أو جودة الخدمة للخطر.\n\nالطبعة األولى -ديسمبر 2025 50", "اإلشراف الداعم\n\nقبل كل زيارة إشراف مجدولة أو غير مجدولة، يجب على مسؤولي التعامل مع اللقاحات تجهيز ما\nيلي:\nسجالت مراقبة درجة الحرارة\n• مخططات درجة الحرارة اليومية المكتملة للشهر بأكمله، بقراءات واضحة، وتوقيعات،\nوتعليقات ألي تجاوزات.\n• تنبيهات نظم مراقبة الحرارة (لمدة ثالثين يوما أو نظام المراقبة اللحظية) في سجل القيد.\nوثائق إدارة المخزون\n• بطاقات مخزونُمحدَّثة للقاحات، والمحاليل الُمَخفِّفة، والمحاقن، وصناديق األمان.\n• عّد دقيق للمخزون يطابق أرصدة بطاقات المخزون.\n• سجل الهدرُمحدَّث بأسباب الهدر وتفاصيل التخلص من الطعوم المهدرة.\nتنظيم ثالجة تخزين اللقاحات وسلسلة التبريد\nثالجة تخزين اللقاحاتُمَّ\n• نظفة وُمرتبة وفقًا لخريطة التخزين (اللقاحات الحساسة للتجميد في\nاألعلى، والمذيبات في الثالجة، وال شيء في الباب إال إذا كان مصمًما للتخزين، وصندوق\nالَحجْ ر واضح وعليه ملصق تحذيري)\n• مستوى الجليد (الثلج) دون 5ملم.\n• مساحة تهوية كافية حول ثالجة تخزين اللقاحات.\nتوثيق الجلسة\n• سجل تطعيمُمحدَّث وأوراق حصر للمستهدفين بالتطعيم.\n• سجالت جلسات التطعيم الخارجية، مع توثيق ظروف النقل (ملف تنفيذ الجلسات).\n• مالحظات حول أي فرص ضائعة تم تحديدها أثناء الجلسات.\nسجالت الحَجْ ر والحوادث (األحداث الخاصة)\n• صندوق الَحجْ ر واضح وعليه ملصق تحذيري، ويسهل تمييزه عن المخزون القابل لالستخدام.\n• نماذج تجاوز درجة الحرارةُمكتملة عند حدوث تجاوزات.\n• أي اشتباه في تلف التجميد أو الحرارةُموثَّق وُمبلَّغ عنه.\nالسالمة وإدارة النفايات\n• صناديق األمانُمغلقة عند امتالء ثالثة أرباع سعتها ومخزنة في المنطقة اآلمنة.\n• جدول التخلص من النفايات يتم تنفيذه وتوثيق ذلك.\nمشكالت المرفق للمناقشة (حدد المشكالت التي ترغب في عرضها ومناقشتها أو طلب دعم للتغلب\nعليها)\n• مشكالت سلسلة التبريد المستمرة (مثل عدم استقرار الطاقة، أداء ثالجة تخزين اللقاحات،\nضعف البطارية الشمسية، نقص الوقود للُمولِّدات).\n• أي تحديات في المخزون أو نقص وشيك.\n• الدعم الالزم للحمالت أو الجلسات الخارجية في المرحلة المقبلة.\nيضمن تجهيز هذه العناصر أن يتمكن المشرفون من التركيز على التوجيه وحل المشكالت وتعزيز\nاألداء بدالً من البحث عن وثائق مفقودة أو تصحيح أخطاء يمكن تجنبها. يحسن التجهيز الفعال\nمن جودة خدمات التطعيم ويدعم خطة تحسين إدارة اللقاحات في ليبيا.\n\nالطبعة األولى -ديسمبر 2025 51"]}, {"id": "gloss", "title": "قاموس المصطلحات الرئيسية", "emoji": "📚", "pages": ["09.\nقاموس المصطلحات الرئيسية\n\nيشرح هذا القاموس المصطلحات األساسية المستخدمة في هذا الكتيب، وقد تم تصميمه لمساعدة\nالقائمين على التطعيم، ومسئولي سلسلة التبريد، والمشرفين على فهم المفردات الفنية الشائعة\nاالستخدام في مجال التطعيمات وإدارة سلسلة التبريد، وهي مصطلحات متكررة في محتوى اإلدارة\nالفعالة للقاحات لمنظمة الصحة العالمية /اليونيسف، واألدلة التشغيلية للمركز الوطني لمكافحة\nاألمراض.\n\nيمكنك استخدام هذا القاموس كمرجع سريع كلما واجهت مصطلًحا لست متأكدًا منه، خاصة أثناء\nمراقبة سلسلة التبريد، والتعامل مع اللقاحات، وإدارة المخزون، وتجهيز الجلسات.\n\nأي عارض طبي يحدث بعد التطعيم وال يُشترط أن يكون له عالقة حدث جانبي ضار (أو\nفورا إلى المسؤول عن المرفق أو\nسببية باللقاح. ويجب اإلبالغ عنهً حدث غير مرغوب فيه\nمشرف المركز الوطني لمكافحة األمراض. بعد التطعيم)\n\nمحقنة تستخدم لمرة واحدة ذات آلية مدمجة تغلق المكبس تلقائيًا بعد\nالمحقنة (السرنجة)\nحقنة واحدة، مما يجعل إعادة االستخدام مستحيلة، وهي الوسيلة\nذاتية التعطيل\nالموصى بها من منظمة الصحة العالمية لجميع أنشطة التحصين.\n\nرمز فريد يمنحه الُمصنِّع لتحديد دفعة إنتاج محددة من اللقاحات، وهو\nرقم التشغيلة\nكود ضروري للتتبُّع واإلبالغ وتوثيق الهدر وترصد األحداث الجانبية\n\nالطبعة األولى -ديسمبر 2025 52", "قاموس المصطلحات الرئيسية\n\nلقاح حيُمجفَّف ( ُمجفَّد) ضد السل (الدرن). شديد الحساسية للضوء. بعد\nإعادة تركيبه بالمحلول الُمَخفِّف المطابق له (إذابته بمذيب معتمد من المصنع\nلقاح الدرن\nالمنتج)، يجب حفظ اللقاح بين ( 8-2درجة مئوية) والتخلص منه في غضون\nست ساعات أو في نهاية الجلسة، أيُّهما أقرب.\n\nحاوية تُستخدم لنقل اللقاحات لمسافات طويلة بين المخزن المركزي ومخازن\nالبلديات والمرافق الصحية، وهي أحد المعدات السلبية /غير النشطة من\nصندوق التبريد\nمعدات سلسلة التبريد (أي أنها ال تحتوي على مصدر لتغيير درجة حرارة\nمساحة التخزين)\n\nنظام متسلسل بال فجوات لتخزين ونقل اللقاحات في درجات الحرارة الموصى\nسلسلة التبريد\nبها، بدًءا من الُمصنِّع وحتى نقطة االستخدام.\n\nتشمل الثالجات المبطنة بالثلج، والُمجّمدات، وغرف التبريد، والثالجاتُمِعدَّات سلسلة\nالشمسية، وصناديق التبريد، وحوامل اللقاحات، وأجهزة مراقبة درجة\nالحرارة، وُمِ ّ التبريد\nنظمات الجهد.\nأي حدث يتعرض فيه اللقاح لدرجات حرارة خارج النطاق المرغوب (8 – 2 خرق سلسلة\nدرجات، وعندها يجب تسجيله واإلبالغ عنه. التبريد\n\nغرفة تخزين كبيرة يتم التح يب قبل االستخدام حيث يلزم\nإذابته ويجب التخلص منه في غضون ست ساعات بعد إعادة التركيب لقاحُمجفَّف ( ُمجفَّد)\n)(BCG, MR, MMR\n\nنقاط تخزين محلية تستلم اللقاحات من المخزن الوطني للمركز الوطني\nمخزن البلدية\nلمكافحة األمراض وتعيد توزيعها على المرافق الصحية.\n\nالسلطة الوطنية المسؤولة عن إدارة سلسلة إمداد التحصين وسلسلة المركز الوطني\nالتبريد وتوزيع اللقاحات في ليبيا. لمكافحة األمراض\n\nلقاح حساس للحرارة يتطلب تحكًما دقيقًا في درجة الحرارة. يَُّورد لقاح شلل األطفالُمَجَّمدًا على المستوى الوطني، ولكن يَُّخزن عند المدى الحراري (2+ الفموي\n)8+ -في المرافق الصحية. )(OPV\n\nمِعدَّات ال تتطلب كهرباء، وتشمل صناديق التبريد، وحافظات الُمِعدَّات غير النشطة\nاللقاحات، وأكياس التبريد (عبوات الثلج). (أو العازلة)\n\nالطبعة األولى -ديسمبر 2025 54", "قاموس المصطلحات الرئيسية\n\nقدرة اللقاح على إحداث استجابة مناعية. وال يمكن استعادة الفاعلية حال\nالفاعلية\nفقدها.\nأي انقطاع للكهرباء. وهو حدث هام يجب توثيقه وإدارته بإجراءات\nانقطاع التيار الكهربائي\nاحتياطية.\nحاوياتُمعلَّمة بوضوح حيث تُ َّ\nخزن القوارير المشتبه بها (التالفة،\nالُمجَّمدة، منتهية الصالحية، المعرضة للتجاوز الحراري) حتى يتحقق صندوق الحَجْ ر\nالمشرف من حالتها.\n\nنظام يراقب ويسجل درجة حرارة الثالجات /غرف التبريد لحظياً ويرسل نظام المراقبة اللحظي\nتنبيهات عبر الرسائل النصية /البريد اإللكتروني عندما تخرج درجات عن بعد لدرجة الحرارة\nالحرارة عن النطاق. )(RTMS\n\nحاوية مدعمة ومقاومة للثقب لإلبر والمحاقن المستعملة. يجب إغالقها\nصندوق األمان\nعند امتالء ثالثة أرباع سعتها.\nإجراء يستخدمه المشرفون لتأكيد أو استبعاد تلف التجميد في اللقاحات\nاختبار الرج /االهتزاز\nالحساسة للتجميد.\n\nسجل ورقي يُستخدم لتتبُّع كميات اللقاحات، والمذيبات، والمحاقن،\nبطاقة المخزون\nوصناديق األمان التي تم استالمها أو استخدامها أو التخلص منها.\n\nنموذج بسيط يُستخدم لتسجيل الجرعات التي تم إعطاؤها أثناء جلسة\nورقة الحصر\nالتطعيم.\n\nنموذج رسمي يوثق أحداث الحرارة أو التجميد، واإلجراءات المتخذة، نموذج تجاوز درجة\nوقرار المشرف. الحرارة\n\nالنظام أو األداة الرقمية األساسية (إن استخدمت) لتسجيل حركة مخزون نظام اإلدارة الشاملة\nاللقاحات وإدارة بيانات سلسلة التبريد مرك VMمرة أخرى.\n\nالتخلص من اللقاحات المذابة (التي أعيد خلطها وتركيبها خالل الجلسة):\n• بنهاية الجلسة يتم إعدام المتبقي من القارورة.\n\nإغالق صندوق األمان (:)Safety Box\n• يتم إغالق الصندوق وتسليمه عندما يمتلئ ثالثة أرباع حجمه الداخلي.\n\nتسجيل الهدر (الكميات الُمهدرة):\n• تحديث سجل الهدر وبطاقات المخزون.\n\nتنظيف وتأمين منطقة العمل (غرفة التطعيم أو الجلسة الخارجية):\n• التخلص من النفايات العامة.\n\nالطبعة األولى -ديسمبر 2025 66", "إجراء التشغيل المعياري ( :)9الصيانة األساسية لثالجات اللقاحات\n\nالغرض: المحافظة على األداء السليم لثالجات اللقاحات ومنع تعطل معدات\nسلسلة التبريد عموماً.\n\nاإلجراءات م\n\nفحص ثالجة اللقاحات مرتين يوميًا:\n• درجة الحرارة، والطاقة، ومثبت الجهد، والصقيع، وختم الباب.\n\nتنظيف الجزء الخارجي لثالجة اللقاحات أسبوعًيا:\n• إزالة الغبار من هيكل الثالجة وفتحات التهوية.\n\nضمان التهوية المناسبة:\n• الحفاظ على فراغ 10سم على األقل حول الثالجات (.)ILRs\n\nالحفاظ على نظافة الجزء الداخلي لثالجة اللقاحات\n• مسح أي انسكابات، وتجنب الصقيع الذي يزيد عن 5ملم.\n\nترتيب اللقاحات بشكل صحيح:\n• اتبع إجراء التشغيل القياسي الخاص بخريطة التخزين داخل الثالجة.\n\nفحص الوصالت واألسالك والقابس الكهربائي:\n• البحث عن التلف أو ارتفاع درجة الحرارة.\n\nاإلبالغ عن أي خلل فوراً:\n• يشمل ذلك كل أنواع الخلل: الضوضاء، أو االهتزاز، أو انحراف\nدرجة الحرارة، أو فشل مثبت الجهد.\n• ال تحاول إجراء إصالحات:\n• اتصل بمشرف البلدية وفني سلسلة التبريد.\n\nالطبعة األولى -ديسمبر 2025 67", "الوسائل المساعدة\n\n10.2 الوسائل المساعدة\nيوفر هذا القسم الوسائل المساعدة كمرجع سريع، وهيُمصممة لدعم مسؤولي التعامل مع اللقاحات\nفي أداء المهام اليومية األساسية بأمان واتساق. تُكمل هذه الوسائل المساعدة إجراءات التشغيل\nالمعيارية من خالل تقديم تذكيرات بسيطة ومرئية وسهلة االستخدام لإلجراءات التي يجب تكرارها\nكل يوم أو أثناء كل جلسة. وتتبع هذه الوسائل إرشادات اإلدارة الفعالة للقاحات لمنظمة الصحة\nالعالمية /اليونيسف والبرنامج التدريبي الخاص بإدارة سلسلة التبريد واللقاحات، كما أنها تعالج\nالفجوات التي تم رصدها خالل تقييم اإلدارة الفعالة للقاحات في ليبيا لعام .2024\n\nتركز الوسائل المساعدة المدرجة هنا فقط على األ اللقاحات في وضع التبريد المستمر لفترات طويلة.\n\n.2احمي اللقاحات فوراً\nإذا اشتبهت في حدوث تجميد:\n• أخرج اللقاحات الحساسة للتجميد فقط.\n• ضعها في صندوق الَحجْ ر (.)QUARANTINE box\n• الصق على الصندوق بوضوح\" :يُمنع االستخدام -يُشتبه تعرضها\nللتجميد\".\n• ال تقم برج القارورة، وال تتخلص من أي لقاح.\n\n.3اضمن سالمة اللقاحات األخرى\nق باب ثالجة اللقاحات مغلقاً.\n• أبِ\n• إذا بقيت درجة حرارة الثالجة غير مستقرة، فانقل اللقاحات غير\nالمتأثرة إلى صندوق تبريد مزود بعبوات ثلج ( ُمهيأة).\n• أعد فحص درجة الحرارة كل 30-15دقيقة حتى تستقر.", "الوسيلة المساعدة ( :)6ماذا تفعل إذا اشتبهت في تجمد اللقاحات؟ (2/2)\n\n.4أبلغ المشرف فوراً\nأبِلغ مشرف البلدية أو نقطة االتصال في المركز الوطني لمكافحة األمراض\nبما يلي:\n• وقت االشتباه بالتجميد ودرجة حرارة ثالجة اللقاحات عند الكشف.\n• عدد ونوع اللقاحات التي تم وضعها في الحجر.\n• قراءات أو إنذارات نظام ( )RTMSأو جهاز (.)30DTR\n• أي انقطاع في التيار الكهربائي أو عطل في المعدات تم مالحظته.\nيجب على الممارسين الصحيين عدم اختبار اللقاح أو اتخاذ قرار بشأن\nصالحيته لالستخدام.\n\n.5وثّق كل ما يحدث\n• سجّل قراءات درجة الحرارة والخروقات في سجل مراقبة درجة\nالحرارة.\n• سجّل القوارير المعزولة في سجل الحجر.\n• أكمل نموذج انحراف درجة الحرارة (حسب التعليمات).ِ\n• انتظر مصادقة المشرف\n.6انتظر القرار النهائي للمشرف\nدرب في البلدية أن يقوم بما يلي:\nيمكن لمشرف اللقاحات الُمَّ\n• إجراء اختبار الرج\n• تأكيد التلف وبالتالي إضافة اللقاحات إلى سجل الهدر.\n• إعالن صالحية اللقاحات لالستخدام وبالتالي الموافقة على إعادة\nاللقاحات إلى المخزون القابل لالستخدام (إذا كانت آمنة).\nيجب على الممارسين الصحيين عدم إعادة اللقاحات المعزولة إلى ثالجة\nاللقاحات دون موافقة المشرف.", "الوسيلة المساعدة ( :)7تصنيف التجاوز الحراري وتوثيقه\n\n.1تصنيف االنحراف الحراري\n\nانحراف طويل المدة (> 30دقيقة أو لم\nانحراف قصير المدى (< 30\nيُحل):\nدقيقة):\n• خطر مرتفع.\n• تم تصحيحه بسرعة.\n• انقل اللقاحات إلى صندوق تبريد\n• ال يتوقع حدوث تلف.\n• اعزل القوارير المشتبه بها\n• التزم بالتوثيق فقط\n• أبلغ المشرف فوراً\n\n.2التوثيق المطلوب\n• التسجيل في مخطط درجة الحرارة.\n• تدوين الوقت، والسبب، واإلجراء التصحيحي المتخذ.\n• إذا كان االنحراف طويل المدة، يجب إكمال نموذج انحراف درجة\nالحرارة (حسب التعليمات).\n• تسجيل بيانات القوارير المعزولة في سجل الحجر.\n• تحديث بطاقات المخزون بعد قرار المشرف.\n.3القرار النهائي\n\nالمشرف أو فريق سلسلة التبريد في المركز الوطني لمكافحة األمراض هم\nفقط من يقررون ما إذا كان:\n• سيتم إرجاع اللقاحات إلى رصيد اللقاحات الصالحة لالستخدام (سجل المخزون).\n• سيتم تصنيف اللقاحات على أنها تالفة وبالتالي يتم إعدامها وتسجيلها في (سجل\nالهدر).\nيجب أال يتم اتخاذ القرار على مستوى الممارسين الصحيين مطلقاً", "الوسيلة المساعدة ( :)8كيفية احتساب االحتياج من اللقاحات\n\n.1جمع المعلومات المطلوبة\n• أ. االستهالك الشهري (الجرعات المستخدمة الشهر الماضي).\n• ب. المخزون الحالي القابل لالستخدام (القوارير ذات تاريخ الصالحية\nالساري مع درجة مقبولة لراصد صالحية قارورة الطعم)\n• ج. متطلبات المخزون االحتياطي (المخزون اآلمن في الحدود المقررة من\nالمركز الوطني لمكافحة، عادة في حدود )%25\n\n.2استخدام معادلة الطلب\nكمية الطلب = (أ × - )1.25 ب\nحيث:\n[أ × :]1.25 هي الكمية المطلوبة ( )%100 = 1مضافاً إليها المخزون\nاالحتياطي (.)%25 = 0.25\n[ب] :الرصيد الحالي الموجود بالفعل.\n\n.3التحقق من صحة البيانات ودقة الطلب\nقبل إرسال طلبك إلى مخزن البلدية، تحقق مما يلي:\n• لم يتم احتساب أي قوارير منتهية الصالحية أو معزولة (في الحجر) ضمن\n[ب].\n• االستهالك الشهري يعكس نشاط الجلسات الفعلي.\n• تم إدراج الحمالت وجلسات التطعيم الخارجية المخططة في الطلب.\n\n.4مثال عملي:\nاستهالك الشهر الماضي (أ) 120: جرعة\nالرصيد الحالي (ب) 30: جرعة\nكمية الطلب = (30 – )1.25*120\nكمية الطلب = 120 = 30 – 150جرعة", "الوسيلة المساعدة ( :)9تعليمات الحقن اآلمن\n\n.1قبل الحقن\n• استخدم فقط الحقن ذاتية التعطيل لكل جرعة.\n• تحقق من تاريخ انتهاء الصالحية وحالة راصد صالحية القارورة.\n• جِ ّهز صندوق أمان بحيث يكون في متناول اليد.\n• قم بنظافة اليدين (بالماء والصابون).\n• استخدم منطقة نظيفة ومضاءة جيداً وخالية من الفوضى.\n\n.2أثناء الحقن\n• استخدم حقنة ذاتية التعطيل جديدة لكل طفل.\n• ال تُ ِعْد تغطية اإلبر في أي وقت.\n• تأكد من سحب الجرعة الصحيحة.\n• ق حامل اللقاحات مغلقاً عندما ال تقوم بإخراج قارورة. أبِ\n• بالنسبة للقاحات المعاد تركيبها: استخدم المذيبات المتطابقة وتخلص\nمن القارورة المعاد تركيبها في غضون ست ساعات أو في نهاية\nالجلسة.\n\n.3في حال تعرضك للوخز /اإلصابة\n• أوقف اإلجراء فوراً.\n• اغسل الجرح بالماء والصابون الجاري.\n• أبِلغ مشرفك.\n• اتبع بروتوكول الوقاية بعد التعرض ( Post-Exposure\n)Prophylaxis\n\n.4تجنّب هذه الممارسات غير اآلمنة\n• ال تُ ِعْد استخدام الحقن.\n• ال تُ ِعْد تغطية اإلبر.\n• ال تترك صندوق األمان مفتوحاً.\n• ال تضع األدوات الحادة في النفايات العادية.\n• ال تُ ِعْد تركيب اللقاحات أبداً بمذيبات غير متطابقة.", "الوسيلة المساعدة ( :)10مخطط إدارة النفايات (1/2)\n\n.1أثناء جلسة التطعيمات\n• ضع جميع الحقن واإلبر الُمستخدمة فوراً في صندوق األمان.\n• ال تُ ِعْد تغطية اإلبر، أو ثنيها، أو إزالتها.\n• ق صندوق األمان في متناول اليد وبال عوائق. أبِ\n• افصل النفايات العامة (القطن، األغلفة) عن األدوات الحادة.\n.2عندما يمتلئ صندوق األمان (ثالثة أرباع الحجم الداخلي)\n• أغلق صندوق السالمة بإحكام.\n• ال تُ ِعْد فتح الصناديق التي تم إغالقها.\n• ضع ملصقاً على الصندوق إذا كان ذلك مطلوباً حسب بروتوكول\nالتخلص من النفايات في المرفق.\n\n.3التخزين المؤقت\n• انقل صناديق األمان المغلقة إلى منطقة التخزين اآلمنة (المخصصة\nلذلك).\n• أبِقها بعيداً عن األطفال والمرضى والحيوانات والجمهور.\n• قم بالتخزين في ظروف نظيفة ومغلقة وجافة.\n.4النقل لمرحلة التخلص النهائي\n• أبِلغ المسؤول عن نفايات البلدية أو مشرف المركز الوطني لمكافحة\nاألمراض عندما تصبح الصناديق جاهزة.\n• انقل الصناديق المغلقة وفقاً لإلرشادات المحلية.\n• ال تنقل األدوات الحادة مطلقاً في أكياس أو حاويات مفتوحة.", "الوسيلة المساعدة ( :)10مخطط إدارة النفايات (2/2)\n\n.5التخلص النهائي\nيجب التخلص من صناديق السالمة من خالل الطريقة المعتمدة من البلدية\nوالمركز الوطني لمكافحة األمراض، ويكون عن طريق:\n• الحرق.\n• التخلص تحت درجة حرارة عالية.\n• أنظمة معالجة نفايات الرعاية الصحية األخرى المعتمدة.\nيجب على الممارسين الصحيين عدم إجراء الحرق بأنفسهم ما لم يكونوا\nخولين.\nدربين وُمَُّمَّ\n\n.6التوثيق\n• سجّل عدد صناديق األمان (ووزنها) التي تم إغالقها ونقلها.\n• دون تاريخ التخلص وتوقيع الجهة المستِلمة.ّ\n• حدِث سجل نفايات المرفق الصحي.ّ\n.7ال تقم بما يلي أبداً\n• ال تتخلص من األدوات الحادة في النفايات العامة.\n• ال تترك صناديق األمان مفتوحة أو دون مراقبة.\n• ال تحرق النفايات في حفر مفتوحة.\n• ال تخلط النفايات الطبية مع نفايات المنازل.", "الوسيلة المساعدة ( :)11قائمة فحص جلسات التطعيم الخارجية (1/2)\n\n.1سلسلة التبريد وتحضير اللقاحات\n• حامل اللقاحات نظيف وجاهز.\n• تم تجهيز العدد الصحيح من عبوات الثلج الُمهيأة.\n• تم اختيار اللقاحات وفقاً للجلسة المخطط لها.\n• تم مطابقة المذيبات مع اللقاحات وتبريدهاُمسبقاً لمدة ال تقل عن 24ساعة.\n• تم وضع جهاز مراقبة درجة الحرارة داخل الحامل.\n• تم وضع األلواح اإلسفنجية ( )Foam Padsأو العلب بشكل صحيح لحماية القوارير\nأثناء االستخدام.\n\n.2مستلزمات جلسة التطعيم\n• الحقن: توفير حقن ذاتية التعطيل (اإلتالف) وحقن اإلذابة بالحجم والكمية المناسبين.\n• التخلص من النفايات: توفير صناديق األمان وتعليمات التعامل مع األدوات الحادة.\n• التعقيم: القطن، ومعقمات اليدين، وأكياس النفايات العامة.\n\n.3التوثيق\n• سجل التطعيم.\n• سجل حصر األطفال المستهدفين بالجلسة.\n• بطاقات تحصين الطفل.\n• خطة جلسة التطعيم الخارجي والقائمة المستهدفة.\n• نماذج اإلحالة الخاصة باألحداث الجانبية التالية للتطعيم.\n• األدوات المكتبية كاألقالم وغيرها (حسب الحاجة).\n.4الوقاية من العدوى واستعداد الموظفين\n• مواد غسل اليدين.\n• قفازات (قد تكون مطلوبة حسب خطة التعامل مع األحداث الجانبية التالية للتطعيم أو\nاإلجراءات الخاصة).\n• ترتيب منطقة عمل نظيفة وآمنة في الموقع.\n• معدات الحماية الشخصية ( قد تكون ضمن متطلبات اإلعداد للجلسات الخارجية).", "الوسيلة المساعدة ( :)11قائمة فحص جلسات التطعيم الخارجية (2/2)\n\n.5مواد التواصل والحشد والتعبئة المجتمعية\n• تم التحقق من االتجاهات المؤدية إلى موقع جلسة التطعيم الخارجية.\n• أرقام االتصال بالمرفق، والمشرف، والبلدية لجهات االتصال الرئيسية ( Focal\nPoints).\n• رسائل تحريك المجتمع (إذا كانت ذات صلة).\n• تم توفير مواد الهوية البصرية (السترة، الشارة، الالفتة).\n.6النقل والسالمة\n• تم ترتيب النقل وتأكيد توفير وسيلة المواصالت (السيارة).\n• الوقود متوفر للرحلة بأكملها.\n• وضع حامل اللقاحات بشكل آمن أثناء السفر.\n• تجنب تعريض حامل اللقاحات ألشعة الشمس المباشرة أثناء السفر.\n• التأكد من تقييم مسارات السفر اآلمنة.\n.7قبل مغادرة موقع جلسة التطعيم الميدانية\n• يتم عّد الجرعات التي تم إعطاؤها.\n• يتم تسجيل اللقاحات الُمستخدمة، والمفتوحة، وغير المفتوحة، والُمهدرة.\n• يتم إعادة القوارير المتبقية غير المفتوحة إلى ثالجة اللقاحات فوراً.\n• يتم إغالق صندوق األمان بإحكام عندما يمتلئ ثالثة أرباعه.\n• يتم تجميع النفايات العامة وتنظيف المنطقة.\n.8بعد العودة إلى المركز الصحي\nيتم تحديث بطاقات المخزون (أرصدة التطعيمات المتاحة).\nيتم تحديث سجالت حصر المتطعمين (لتحديث نسب التغطية).\nيتم اإلبالغ عن أي أحداث جانبية، أو أحداث تتعلق بسلسلة التبريد، أو تباين في\nالمخزون.\nيتم تخزين حوامل اللقاحات مفتوحة وجافة لالستخدام التالي.", "الوسيلة المساعدة ( :)12عالمات أعطال الثالجات المبطنة بالثلج (1/2)\n\n.1مشاكل درجة الحرارة\n• انخفاض درجة الحرارة عن °2+مئوي(خطر تجميد اللقاحات).\n• ارتفاع درجة الحرارة عن °8+مئوي (خطر التعرض للحرارة).\n• تذبذب واسع في درجة الحرارة من الصباح إلى المساء.\n• ظهور إنذارات متكررة صادرة عن نظام ( )RTMSأو جهاز (.)30DTR\nاإلجراء: انقل اللقاحات إلى صندوق تبريد إذا بقيت درجة الحرارة خارج النطاق ألكثر من 30\nدقيقة وأبِلغ المشرف.\n\n.2مشاكل الطاقة أو الكهرباء\n• انقطاعات متكررة في التيار الكهربائي دون وجود مولد احتياطي أو مصدر للطاقة الشمسية.\n• ثالجة اللقاحات ( )ILRsال يتم استعادة تشغيلها تلقائياً بعد عودة التيار الكهربائي.\n• مثبت الجهد ال يعمل، أو ينقطع بشكل متكرر.\nً\n• مقبس الكهرباء أو الوصالت تبدو تالفة أو منصهرة جزئيا نتيجة زيادة أحمال الطاقة.\nاإلجراء: ال تفتح ثالجة اللقاحات، أبلغ فوراً، وجّهز صندوق تبريد لنقل الطعوم إليه إذا تجاوز\nاالنقطاع 30دقيقة.\n\n.3مشاكل الثلج أو الصقيع\n• طبقة صقيع يزيد سمكها عن 5ملم داخل حجرة ثالجة اللقاحات (.)ILRs\n• تراكم الجليد لدرجة مالمسة السالل الحاملة للقاحات.\n• قوارير لقاحات متجمدة أو بلورات ثلج مرئية داخل قوارير اللقاح.\n\nاإلجراء: اعزل (جنّب) اللقاحات الحساسة للتجميد داخل صندوق الحجر بالثالجة، وأبِلغ\nالمشرف.\n\n.4مشاكل تدفق الهواء أو التبريد\n• ثالجة اللقاحات ( )ILRsتعمل باستمرار دون تثبيت درجات الحرارة.\n• ثالجة اللقاحات تنطفئ بشكل متكرر أو تعمل بشكل غير منتظم (تتأرجح).\n• وجود هواء دافئ داخل ثالجة اللقاحات ( )ILRsعند فتح الباب.\n\nاإلجراء: تحقق من مساحة التهوية حول الثالجة ( 10سم كحد أدنى)، وتأكد من أن ثالجة\nاللقاحات ليست محّملة فوق طاقتها، وأبِلغ عن العطل (حتى وإن تعذر عليك تحديد سببه).", "الوسيلة المساعدة ( :)12عالمات أعطال الثالجات المبطنة بالثلج (2/2)\n\n.5مشاكل تتعلق بباب الثالجة ومانع تسريب البرودة\n• الباب ال يُغلق بإحكام.\n• اإلطار المطاطي (مانع تسريب البرودة) ال يؤدي وظيفته [ممزق، جاف، متشقق، مفكوك].\n• وجود تكثيف أو رطوبة حول الباب.\n• يتطلب الباب دفعاً قوياً إلغالقه.\nاإلجراء: ال تستخدم ثالجة اللقاحات المعزولة بالجليد ( )ILRحتى يتم إصالحها -يوجد خطر\nالتعرض للحرارة.\n\n.6ضوضاء أو روائح غير عادية\n• أصوات طقطقة، أو طنين عالية لم تُسمع من قبل.\n• رائحة احتراق قادمة من الجزء الخلفي لثالجة اللقاحات (.)ILRs\n• اهتزاز مفرط عند تشغيل ثالجة اللقاحات.\nاإلجراء: افصل قابس الثالجة فقط إذا تم اكتشاف رائحة احتراق؛ انقل اللقاحات إلى صندوق\nتبريد، وأبلِغ مشرف البلدية ومسؤول الصيانة.\n\n.7التلف المادي أو سوء التركيب\n• ثالجة اللقاحات مائلة أو غير ثابتة.\n• الغبار أو األوساخ تسد فتحات التهوية الخلفية.\n• ثالجة اللقاحات موضوعة في غرفة حارة، أو تحت أشعة الشمس المباشرة، أو بالقرب من\nمصدر حرارة.\n• تسرب المياه حول أو تحت ثالجة اللقاحات.\nاإلجراء: عالج المشكالت البيئية فوراً، وأبِلغ عن أي تلف مادي.\n\n.8الخطوات الفورية ألي عالمة عطل\n• ال تفتح ثالجة اللقاحات بشكل متكرر.\n• سّجل درجة الحرارة الحالية.\n• انقل اللقاحات إلى صندوق تبريد إذا كانت درجة الحرارة خارج النطاق أو حدث عطل في\nالجهاز.\n• أبِلغ مشرف سلسلة التبريد في البلدية فوراً.\n• وِثّق المشكلة في مخطط درجة الحرارة وسجل معدات الثالجة.", "الوسيلة المساعدة ( :)13األحداث الجانبية بعد التحصين (1/2)( :)AEFI\nما يجب على مسؤولي التعامل مع اللقاحات فعله\n\nتعرف على العالمات، حافظ على السالمة، أحل للمستشفى، أبلغ جهة االختصاص، وثقَّ\nالحدث كامالً\nال يقوم العاملون الصحيون في مجال اللقاحات بالتحقيق في األحداث الجانبية التالية للتطعيم\nأو يعالجونها، بل يضمنون اإلبالغ واإلحالة السريعة.\n\nتعرف على عالمات الخطر الرئيسية .1\nيجب إحالة الطفل فوراً إلى المرفق الصحي\nإذا ظهرت عليه أي من هذه األعراض\nبعد التطعيم:\n• طفح جلدي منتشر.\n• صعوبة في الت ces.\n)Libya. Effective Vaccine Management Assessment (EVMA\nFindings.\nLibya. Comprehensive EPI Review 2025.\n• Libya. RTMS Monitoring Reports.\nمواد تشغيلية إضافية تم الرجوع إليها.\nباإلضافة إلى إرشادات منظمة الصحة العالمية /اليونيسف المعيارية المذكورة أعاله، تم الرجوع\nإلى بعض المواد التشغيلية الدولية كأمثلة للممارسة الجيدة لهيكلة إجراءات التشغيل المعيارية\nوالوسائل المساعدة سهلة االستخدام. تشمل هذه األمثلة:\n• دليل التعامل مع اللقاحات وسلسلة التبريد -اليونيسف الهند.\nتم استخدام هذه المواد كمراجع داعمة للتخطيط والتصميم التعليمي، بينما تم تكييف كل المحتوى\nالفني بدقة وفًقا للمعايير العالمية لمنظمة الصحة العالمية/اليونيسف ولسياق ومتطلبات المركز\nالوطني لمكافحة األمراض في ليبيا.\n\nالطبعة األولى -ديسمبر 2025 92"]}];

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function buildMapsUrl(centerName, address, muniName) {
  const parts = [centerName, address, muniName, "ليبيا"].filter(Boolean);
  return "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(parts.join(" "));
}

// عرض نص بصيغة مبسطة (## عنوان، **عريض**، • نقطة، > ملاحظة)
function renderBook(md){
  const out = [];
  md.split('\n').forEach(function(raw){
    const line = raw.trim();
    if (line === '') { return; }
    let h = esc(line).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
    if (line.startsWith('###')) { out.push('<h4>' + h.replace(/^###\s*/, '') + '</h4>'); }
    else if (line.startsWith('##')) { out.push('<h4>' + h.replace(/^##\s*/, '') + '</h4>'); }
    else if (line.startsWith('&gt;') || line.startsWith('>')) { out.push('<div class="note">' + h.replace(/^(&gt;|>)\s*/, '') + '</div>'); }
    else if (/^[•\-]/.test(line)) { out.push('<div class="bul">' + h + '</div>'); }
    else { out.push('<p>' + h + '</p>'); }
  });
  return out.join('');
}
