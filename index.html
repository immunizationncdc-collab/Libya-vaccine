let route = { name: 'home' };

function nav(r, replace){
  route = r;
  const m = replace ? 'replaceState' : 'pushState';
  history[m](r, '', '#' + r.name);
  render();
  window.scrollTo({ top: 0, behavior: 'instant' in window ? 'auto' : 'auto' });
}
function goBack(){ history.back(); }

window.addEventListener('popstate', function(e){
  route = (e.state && e.state.name) ? e.state : { name: 'home' };
  render();
});

let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', function(e){
  e.preventDefault(); deferredPrompt = e;
  document.getElementById('install-banner').classList.add('show');
});
document.getElementById('btn-install-click').addEventListener('click', async function(){
  if (deferredPrompt){ deferredPrompt.prompt(); await deferredPrompt.userChoice; deferredPrompt = null;
    document.getElementById('install-banner').classList.remove('show'); }
});
document.getElementById('btn-close-banner').addEventListener('click', function(){
  document.getElementById('install-banner').classList.remove('show');
});
window.addEventListener('appinstalled', function(){
  document.getElementById('install-banner').classList.remove('show');
});

  app.innerHTML = fn(route);
}

          return `<button class="age-btn" onclick="nav({name:'citizenAge',age:'${esc(a)}'})">
                    <span class="emoji">${i.emoji}</span>${esc(i.label)}
                  </button>`;
        }).join('')}
      </div>
    </div>
    ${SRC1}
  `;
},

// ---------- معلومات للمواطن: تطعيمات العمر ----------
citizenAge: function(r){
  const info = vaccineSchedule[r.age];
  if (!info) return SCREENS.citizen();
  const cards = info.vaccines.map(function(vn){
    const key = vaccineKeyMap[vn];
    const v = key ? vaccineInfo[key] : null;
    if (!v) return `<div class="center-card"><div class="center-name">💉 ${esc(vn)}</div></div>`;
    return `
      <button class="vx-card" onclick="nav({name:'vaccine',key:'${key}',from:'citizenAge',age:'${esc(r.age)}'})">
        <div class="vx-emoji">${v.emoji}</div>
        <div>
          <div class="vx-name">${esc(v.name)}</div>
          <div class="vx-en">${esc(v.en)}</div>
          <div class="vx-prot">🛡️ يقي من: ${esc(v.protects.join('، '))}</div>
        </div>
        <div class="vx-arrow">‹</div>
      </button>`;
  }).join('');

  return `
    <p class="crumb">الرئيسية › معلومات للمواطن › <b>${esc(info.label)}</b></p>
    <div class="results-header">
      <h2>${info.emoji} ${esc(info.label)}</h2>
      <p>التطعيمات المستحقة في هذا العمر: <strong>${info.vaccines.length}</strong></p>
    </div>
    <p style="font-size:12.5px;color:#777;margin-bottom:12px;line-height:1.8">اضغط على أي طعم لعرض تفاصيله الكاملة والأمراض التي يقي منها.</p>
    ${cards}
    <button class="btn-reset" onclick="nav({name:'muni'})">🏥 أين أطعّم طفلي؟ — ابحث عن أقرب مركز</button>
    ${SRC1}
  `;
},

// ---------- تفاصيل الطعم ----------
vaccine: function(r){
  const v = vaccineInfo[r.key];
  if (!v) return SCREENS.home();
  return `
    <div class="detail-hero">
      <div class="big">${v.emoji}</div>
      <h2>${esc(v.name)}</h2>
      <p>${esc(v.en)}</p>
    </div>

    <div class="info-block">
      <h3>🛡️ يقي من الأمراض التالية</h3>
      <div>${v.protects.map(function(d){ return '<span class="dis-pill">'+esc(d)+'</span>'; }).join('')}</div>
    </div>

    <div class="info-block">
      <h3>📖 عن المرض والطعم</h3>
      <div class="txt">${esc(v.about)}</div>
    </div>

    <div class="info-block">
      <h3>💉 معلومات الطعم</h3>
      <table class="spec-table">
        <tr><th>نوع الطعم</th><td>${esc(v.type)}</td></tr>
        <tr><th>التخزين</th><td>${esc(v.storage)}</td></tr>
        <tr><th>عدد الجرعات</th><td>${esc(v.doses)}</td></tr>
        <tr><th>مقدار الجرعة</th><td>${esc(v.amount)}</td></tr>
        <tr><th>موضع التطعيم</th><td>${esc(v.site)}</td></tr>
        <tr><th>طريقة الإعطاء</th><td>${esc(v.route)}</td></tr>
      </table>
    </div>

    ${v.notes ? `<div class="warn-block"><h3>⚠️ ملاحظات ومحاذير</h3><div class="txt">${esc(v.notes)}</div></div>` : ''}
    ${SRC1}
  `;
},

// ---------- مراكز التطعيم: البلدية ----------
muni: function(){
  const list = Object.keys(municipalities);
  return `
    <p class="crumb">الرئيسية › <b>أماكن مراكز خدمة التطعيم</b></p>
    <div class="section-card">
      <div class="section-title"><div class="icon">🗺️</div> اختر البلدية</div>
      <div class="search-wrap">
        <input type="text" id="muni-search" class="search-input" placeholder="ابحث عن اسم البلدية..." autocomplete="off" oninput="filterMunicipalities(this.value)" />
        <span class="search-icon">🔍</span>
      </div>
      <p class="search-count" id="muni-count">${list.length} بلدية متاحة</p>
      <div class="grid-2" id="muni-grid">${list.map(renderMuniBtn).join('')}</div>
      <div class="muni-empty" id="muni-empty" style="display:none;"><span class="big">😕</span>لم يتم العثور على بلدية بهذا الاسم</div>
    </div>
  `;
},

// ---------- مراكز التطعيم: العمر ----------
muniAge: function(r){
  const ages = Object.keys(vaccineSchedule);
  return `
    <p class="crumb">الرئيسية › مراكز التطعيم › <b>${esc(r.muni)}</b></p>
    <div class="section-card">
      <div class="section-title"><div class="icon">👶</div> اختر عمر الطفل</div>
      <p style="font-size:13px;color:#777;margin-bottom:14px;">بلدية: <strong>${esc(r.muni)}</strong></p>
      <div class="grid-3">
        ${ages.map(function(a){
          const i = vaccineSchedule[a];
          return `<button class="age-btn" onclick="nav({name:'muniResult',muni:'${esc(r.muni)}',age:'${esc(a)}'})">
                    <span class="emoji">${i.emoji}</span>${esc(i.label)}
                  </button>`;
        }).join('')}
      </div>
    </div>
  `;
},

// ---------- مراكز التطعيم: النتائج ----------
muniResult: function(r){
  const mData = municipalities[r.muni];
  const ageInfo = vaccineSchedule[r.age];
  if (!mData || !ageInfo) return SCREENS.muni();

  const valid = mData.centers.filter(function(c){ const d = c.days[r.age]; return d && d.length > 0; });

  const vaccineHtml = ageInfo.vaccines.map(function(vn){
    const key = vaccineKeyMap[vn];
    return key
      ? `<span class="vaccine-pill" style="cursor:pointer" onclick="nav({name:'vaccine',key:'${key}'})">💉 ${esc(vn)}</span>`
      : `<span class="vaccine-pill">💉 ${esc(vn)}</span>`;
  }).join('');

  const centersHtml = valid.length === 0
    ? `<div class="no-results"><div class="big">😔</div><p>لا توجد مراكز متاحة لهذا العمر في بلدية ${esc(r.muni)}<br>تواصل مع إدارة الصحة المحلية</p></div>`
    : valid.map(function(c){
        const days = c.days[r.age];
        const daysHtml = days.map(function(d){
          const hi = ['يومياً','طيلة أيام الأسبوع'].indexOf(d) >= 0 ? 'highlight' : '';
          return '<span class="day-chip '+hi+'">'+esc(d)+'</span>';
        }).join('');
        const url = buildMapsUrl(c.name, c.address, r.muni);
        return `
          <div class="center-card">
            <div class="center-name">🏥 ${esc(c.name)}</div>
            <div class="center-info">
              ${c.address ? `<div class="center-row"><span class="lbl">📍 العنوان:</span> <span>${esc(c.address)}</span></div>` : ''}
              ${c.note ? `<div class="center-row"><span class="lbl">ℹ️ ملاحظة:</span> <span>${esc(c.note)}</span></div>` : ''}
              <div class="center-row"><span class="lbl">📅 أيام التطعيم:</span></div>
              <div class="days-wrap">${daysHtml}</div>
              <a class="btn-maps" href="${url}" target="_blank" rel="noopener noreferrer">🗺️ افتح في خرائط جوجل</a>
            </div>
          </div>`;
      }).join('');

  return `
    <p class="crumb">الرئيسية › مراكز التطعيم › ${esc(r.muni)} › <b>${esc(ageInfo.label)}</b></p>
    <div class="results-header">
      <h2>نتائج البحث</h2>
      <p>وجدنا <strong>${valid.length}</strong> مركز صحي متاح</p>
      <div class="results-meta">
        <span class="tag">🏙️ ${esc(r.muni)}</span>
        <span class="tag">${ageInfo.emoji} ${esc(ageInfo.label)}</span>
      </div>
    </div>
    <div class="vaccines-card">
      <h3>💉 التطعيمات المطلوبة <span style="font-weight:400;font-size:11.5px;color:#777">(اضغط على الطعم لمعرفة تفاصيله)</span></h3>
      <div>${vaccineHtml}</div>
    </div>
    ${centersHtml}
    <button class="btn-reset" onclick="nav({name:'muni'})">🔄 بحث جديد</button>
  `;
},

// ---------- مقدمو الخدمة ----------
provider: function(){
  return `
    <p class="crumb">الرئيسية › <b>معلومات لمقدمي خدمة التطعيم</b></p>
    <div class="home-hero" style="margin-top:0">
      <h2>المرشد في مجال التطعيمات</h2>
      <p>اختر الجزء الذي تريد تصفحه</p>
    </div>
    <div class="menu-grid">
      <button class="menu-card" onclick="nav({name:'g1'})">
        <div class="menu-ico ico-a">📘</div>
        <div class="menu-txt">
          <h3>المرشد – الجزء الأول</h3>
          <p>الطعوم المستخدمة، سلسلة التبريد، الحقن الآمن، جلسات التطعيم، نظام التسجيل، الجدول الوطني</p>
        </div>
        <div class="menu-arrow">‹</div>
      </button>
      <button class="menu-card" onclick="nav({name:'g2'})">
        <div class="menu-ico ico-b">📗</div>
        <div class="menu-txt">
          <h3>المرشد – الجزء الثاني</h3>
          <p>سلسلة الإمداد، التخزين، مراقبة الحرارة، إدارة المخزون، الحقن الآمن، الصيانة، الإشراف الداعم، الملاحق</p>
        </div>
        <div class="menu-arrow">‹</div>
      </button>
    </div>
  `;
},

// ---------- فهرس الجزء الأول ----------
g1: function(){
  return `
    <p class="crumb">الرئيسية › مقدمو الخدمة › <b>المرشد – الجزء الأول</b></p>
    <div class="section-card">
      <div class="section-title"><div class="icon">📘</div> محتويات الجزء الأول</div>
      <div class="grid-2">
        ${guide1Sections.map(function(s){
          return `<button class="choice-btn" onclick="nav({name:'g1sec',id:'${s.id}'})">
                    <div style="font-size:24px;margin-bottom:5px">${s.emoji}</div>${esc(s.title)}
                  </button>`;
        }).join('')}
      </div>
    </div>
    ${SRC1}
  `;
},

// ---------- قسم من الجزء الأول ----------
g1sec: function(r){
  const s = guide1Sections.filter(function(x){ return x.id === r.id; })[0];
  if (!s) return SCREENS.g1();
  const head = `
    <p class="crumb">الرئيسية › مقدمو الخدمة › الجزء الأول › <b>${esc(s.title)}</b></p>
    <div class="detail-hero"><div class="big">${s.emoji}</div><h2>${esc(s.title)}</h2>
      <p>المرشد في مجال التطعيمات – الجزء الأول</p></div>`;

  if (s.kind === 'vaccines'){
    const cards = Object.keys(vaccineInfo).map(function(k){
      const v = vaccineInfo[k];
      return `<button class="vx-card" onclick="nav({name:'vaccine',key:'${k}'})">
                <div class="vx-emoji">${v.emoji}</div>
                <div><div class="vx-name">${esc(v.name)}</div><div class="vx-en">${esc(v.en)}</div>
                <div class="vx-prot">🛡️ ${esc(v.protects.join('، '))}</div></div>
                <div class="vx-arrow">‹</div>
              </button>`;
    }).join('');
    return head + cards + SRC1;
  }

  if (s.kind === 'checklist'){
    const items = s.items.map(function(t, i){
      return `<label class="chk-item" onclick="this.classList.toggle('done')">
                <input type="checkbox" /><span>${esc(t)}</span></label>`;
    }).join('');
    return head + `<div class="info-block">
        <p style="font-size:13.5px;color:#555;line-height:1.9;margin-bottom:10px">${esc(s.intro)}</p>
        ${items}</div>` + SRC1;
  }

  if (s.kind === 'schedule'){
    const rows = Object.keys(vaccineSchedule).map(function(a){
      const i = vaccineSchedule[a];
      const vs = i.vaccines.map(function(vn){
        const key = vaccineKeyMap[vn];
        return key ? `<div style="margin-bottom:4px"><span class="vaccine-pill" style="cursor:pointer" onclick="nav({name:'vaccine',key:'${key}'})">💉 ${esc(vn)}</span></div>`
                   : `<div style="margin-bottom:4px"><span class="vaccine-pill">💉 ${esc(vn)}</span></div>`;
      }).join('');
      return `<tr><td class="sch-age">${i.emoji} ${esc(i.label)}</td><td>${vs}</td></tr>`;
    }).join('');
    return head + `<div class="info-block" style="padding:12px">
        <table class="sch-table"><tr><th>العمر عند التطعيم</th><th>الطعم</th></tr>${rows}</table>
      </div>` + SRC1;
  }

  return head + `<div class="info-block"><div class="book-body">${renderBook(s.body)}</div></div>` + SRC1;
},

// ---------- فهرس الجزء الثاني ----------
g2: function(){
  return `
    <p class="crumb">الرئيسية › مقدمو الخدمة › <b>المرشد – الجزء الثاني</b></p>
    <div class="section-card">
      <div class="section-title"><div class="icon">📗</div> محتويات الجزء الثاني</div>
      <div class="grid-2">
        ${guide2Sections.map(function(s){
          return `<button class="choice-btn" onclick="nav({name:'g2sec',id:'${s.id}'})">
                    <div style="font-size:24px;margin-bottom:5px">${s.emoji}</div>${esc(s.title)}
                  </button>`;
        }).join('')}
      </div>
    </div>
    ${SRC2}
  `;
},

// ---------- قسم من الجزء الثاني ----------
g2sec: function(r){
  const s = guide2Sections.filter(function(x){ return x.id === r.id; })[0];
  if (!s) return SCREENS.g2();
  const pages = s.pages.map(function(p, i){
    return (i ? `<div class="page-sep">صفحة ${i+1} من ${s.pages.length}</div>` : '')
         + `<div class="page-text">${esc(p)}</div>`;
  }).join('');
  return `
    <p class="crumb">الرئيسية › مقدمو الخدمة › الجزء الثاني › <b>${esc(s.title)}</b></p>
    <div class="detail-hero"><div class="big">${s.emoji}</div><h2>${esc(s.title)}</h2>
      <p>المرشد في مجال التطعيمات – الجزء الثاني</p></div>
    <div class="info-block">${pages}</div>
    ${SRC2}
  `;
}

};

// =============================================
// دوال البلديات
// =============================================
function renderMuniBtn(m){
  return `<button class="choice-btn" onclick="nav({name:'muniAge',muni:'${esc(m)}'})">🏙️ ${esc(m)}</button>`;
}

function filterMunicipalities(q){
  q = (q || '').trim();
  const all = Object.keys(municipalities);
  const f = q === '' ? all : all.filter(function(m){ return m.indexOf(q) >= 0; });
  const grid = document.getElementById('muni-grid');
  const empty = document.getElementById('muni-empty');
  const count = document.getElementById('muni-count');
  if (f.length === 0){
    grid.style.display = 'none'; empty.style.display = 'block'; count.textContent = 'لا توجد نتائج';
  } else {
    grid.style.display = 'grid'; empty.style.display = 'none';
    grid.innerHTML = f.map(renderMuniBtn).join('');
    count.textContent = (q === '') ? (f.length + ' بلدية متاحة') : (f.length + ' نتيجة');
  }
}

// =============================================
// البدء
// =============================================
history.replaceState({ name: 'home' }, '', '#home');
render();
</script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  });
}
</script>
