<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>إدارة التطعيمات – ليبيا</title>
<meta name="description" content="تطبيق إدارة التطعيمات – المركز الوطني لمكافحة الأمراض – ليبيا" />
<meta name="theme-color" content="#1a3a6b" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="إدارة التطعيمات" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
:root {
  --green: #006233;
  --green-light: #007a3d;
  --red: #d4000d;
  --black: #000000;
  --gold: #c8a951;
  --bg: #f4f6fa;
  --white: #ffffff;
  --blue-dark: #1a3a6b;
  --blue-mid: #2354a4;
  --ink: #1a1a2e;
  --muted: #6b7280;
  --line: #e4e8f0;
  --shadow: 0 4px 24px rgba(0,0,0,0.10);
  --radius: 18px;
  --radius-sm: 10px;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
body {
  font-family: 'Cairo', 'Tajawal', sans-serif;
  background: var(--bg);
  color: var(--ink);
  min-height: 100vh;
  direction: rtl;
  padding-bottom: env(safe-area-inset-bottom, 0px);
}

/* ===== HEADER ===== */
.header {
  background: linear-gradient(135deg, var(--blue-dark) 0%, var(--blue-mid) 60%, #1a6b3a 100%);
  position: relative;
  overflow: hidden;
  padding-top: env(safe-area-inset-top, 0px);
}
.header::before { content:''; position:absolute; top:-40px; left:-40px; width:200px; height:200px; border-radius:50%; background:rgba(255,255,255,.05); }
.header::after  { content:''; position:absolute; bottom:-30px; right:-30px; width:150px; height:150px; border-radius:50%; background:rgba(255,255,255,.04); }
.header-inner { padding: 16px 16px 14px; position: relative; z-index: 1; }
.header-top { display: flex; align-items: center; gap: 12px; }
.header-logo {
  width: 54px; height: 54px; background: #fff; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; box-shadow: 0 2px 12px rgba(0,0,0,.2); overflow: hidden;
}
.header-logo img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
.header-titles h1 { font-size: 18px; font-weight: 900; color: #fff; line-height: 1.25; }
.header-titles p { font-size: 12px; color: rgba(255,255,255,.82); margin-top: 2px; }
.header-credit { font-size: 10.5px !important; color: rgba(255,255,255,.65) !important; margin-top: 3px !important; }
.header-flag { display: flex; border-radius: 6px; overflow: hidden; height: 8px; margin-top: 10px; }
.flag-r { background: var(--red); flex: 1; }
.flag-b { background: var(--black); flex: 1; }
.flag-g { background: var(--green); flex: 1; }

.btn-back {
  background: rgba(255,255,255,.16); border: 1px solid rgba(255,255,255,.28);
  color: #fff; font-family: 'Cairo', sans-serif; font-size: 13px; font-weight: 700;
  padding: 7px 13px; border-radius: 20px; cursor: pointer; margin-right: auto; white-space: nowrap;
}
.btn-back:active { background: rgba(255,255,255,.28); }

/* ===== INSTALL BANNER ===== */
#install-banner {
  background: linear-gradient(90deg, var(--gold), #e8c060); color: #1a1a1a;
  padding: 10px 16px; display: none; align-items: center; justify-content: space-between; gap: 8px;
}
#install-banner.show { display: flex; }
#install-banner p { font-size: 13px; font-weight: 700; }
#install-banner span { font-size: 11px; display: block; font-weight: 400; }
.btn-install { background: var(--blue-dark); color: #fff; border: none; padding: 8px 14px; border-radius: 8px; font-family:'Cairo',sans-serif; font-size: 13px; font-weight: 700; cursor: pointer; white-space: nowrap; }
.btn-close-banner { background: none; border: none; font-size: 18px; cursor: pointer; color: #333; padding: 0 4px; }

/* ===== LAYOUT ===== */
.main { padding: 18px 16px 44px; max-width: 640px; margin: 0 auto; }
.crumb { font-size: 12px; color: var(--muted); margin-bottom: 12px; line-height: 1.7; }
.crumb b { color: var(--blue-dark); font-weight: 700; }

.section-card { background: #fff; border-radius: var(--radius); padding: 18px; margin-bottom: 14px; box-shadow: var(--shadow); animation: slideUp .35s ease; }
@keyframes slideUp { from { opacity: 0; transform: translateY(14px);} to { opacity: 1; transform: translateY(0);} }
.section-title { font-size: 16px; font-weight: 700; color: var(--blue-dark); margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
.section-title .icon { width: 32px; height: 32px; background: linear-gradient(135deg, var(--blue-mid), var(--blue-dark)); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; }

/* ===== HOME MENU ===== */
.home-hero { text-align: center; margin: 4px 0 18px; }
.home-hero h2 { font-size: 20px; font-weight: 900; color: var(--blue-dark); }
.home-hero p { font-size: 13px; color: var(--muted); margin-top: 6px; line-height: 1.8; }
.menu-grid { display: grid; gap: 12px; }
.menu-card {
  display: flex; align-items: center; gap: 14px; width: 100%; text-align: right;
  background: #fff; border: 2px solid transparent; border-radius: var(--radius);
  padding: 18px 16px; box-shadow: var(--shadow); cursor: pointer;
  font-family: 'Cairo', sans-serif; transition: transform .15s, border-color .2s;
}
.menu-card:active { transform: scale(.985); border-color: var(--blue-mid); }
.menu-ico { width: 56px; height: 56px; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 28px; flex-shrink: 0; }
.ico-a { background: linear-gradient(135deg,#e8f2ff,#cfe2ff); }
.ico-b { background: linear-gradient(135deg,#e6f7ec,#c9ebd6); }
.ico-c { background: linear-gradient(135deg,#fff3e0,#ffe3b8); }
.menu-txt h3 { font-size: 16px; font-weight: 800; color: var(--blue-dark); }
.menu-txt p { font-size: 12.5px; color: var(--muted); margin-top: 4px; line-height: 1.6; }
.menu-arrow { margin-right: auto; color: #c3c9d6; font-size: 20px; }

/* ===== GRID BUTTONS ===== */
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
.choice-btn { background: var(--bg); border: 2px solid transparent; border-radius: var(--radius-sm); padding: 12px 8px; font-family:'Cairo',sans-serif; font-size: 14px; font-weight: 600; color: #2a2a4a; cursor: pointer; text-align: center; transition: all .2s; line-height: 1.3; }
.choice-btn:hover { border-color: var(--blue-mid); background: rgba(35,84,164,.06); }
.choice-btn.selected { border-color: var(--blue-mid); background: linear-gradient(135deg, rgba(35,84,164,.12), rgba(26,58,107,.08)); color: var(--blue-dark); }
.age-btn { background: var(--bg); border: 2px solid transparent; border-radius: var(--radius-sm); padding: 11px 6px; font-family:'Cairo',sans-serif; font-size: 12px; font-weight: 700; color: #2a2a4a; cursor: pointer; text-align: center; transition: all .2s; }
.age-btn:hover { border-color: var(--blue-mid); background: rgba(35,84,164,.06); }
.age-btn.selected { border-color: var(--green); background: linear-gradient(135deg, rgba(0,98,51,.12), rgba(0,122,61,.06)); color: var(--green); }
.age-btn .emoji { font-size: 18px; display: block; margin-bottom: 4px; }

/* ===== SEARCH ===== */
.search-wrap { position: relative; margin-bottom: 14px; }
.search-input { width: 100%; padding: 13px 44px 13px 16px; border-radius: var(--radius-sm); border: 2px solid var(--line); font-family:'Cairo',sans-serif; font-size: 14px; font-weight: 600; background: var(--bg); color: var(--ink); }
.search-input:focus { outline: none; border-color: var(--blue-mid); background: #fff; }
.search-icon { position: absolute; top: 50%; right: 14px; transform: translateY(-50%); font-size: 15px; color: #999; pointer-events: none; }
.search-count { font-size: 12px; color: #999; margin: -6px 0 12px; padding-right: 2px; }
.muni-empty { text-align: center; color: #888; font-size: 13px; padding: 30px 10px; }
.muni-empty .big { font-size: 32px; margin-bottom: 8px; display: block; }
#muni-grid { max-height: 52vh; overflow-y: auto; padding: 2px 2px 2px 0; }

/* ===== RESULTS (centers) ===== */
.results-header { background: linear-gradient(135deg, var(--blue-dark), var(--blue-mid)); border-radius: var(--radius); padding: 16px 20px; color: #fff; margin-bottom: 14px; }
.results-header h2 { font-size: 16px; font-weight: 900; margin-bottom: 4px; }
.results-header p { font-size: 12px; opacity: .85; }
.results-meta { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.tag { background: rgba(255,255,255,.2); padding: 4px 10px; border-radius: 20px; font-size: 12px; }
.vaccines-card { background: linear-gradient(135deg,#f0f7f0,#e8f4ea); border: 1px solid #c8e6c9; border-radius: var(--radius); padding: 16px 20px; margin-bottom: 14px; }
.vaccines-card h3 { font-size: 14px; font-weight: 700; color: var(--green); margin-bottom: 10px; }
.vaccine-pill { display: inline-block; background: #fff; border: 1px solid #a5d6a7; color: #2e7d32; padding: 5px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; margin: 3px 3px 3px 0; }
.center-card { background: #fff; border-radius: var(--radius); padding: 16px; margin-bottom: 12px; box-shadow: 0 2px 12px rgba(0,0,0,.07); border-right: 4px solid var(--blue-mid); animation: slideUp .3s ease; }
.center-name { font-size: 15px; font-weight: 700; color: var(--blue-dark); margin-bottom: 8px; }
.center-info { display: flex; flex-direction: column; gap: 5px; }
.center-row { display: flex; align-items: flex-start; gap: 6px; font-size: 13px; color: #555; }
.center-row .lbl { font-weight: 600; color: #333; white-space: nowrap; }
.days-wrap { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 6px; }
.day-chip { background: var(--bg); border: 1px solid #ddd; border-radius: 6px; padding: 3px 8px; font-size: 11px; color: #444; }
.day-chip.highlight { background: rgba(35,84,164,.1); border-color: var(--blue-mid); color: var(--blue-dark); font-weight: 700; }
.btn-maps { display: inline-flex; align-items: center; justify-content: center; gap: 6px; margin-top: 10px; padding: 9px 14px; background: rgba(35,84,164,.08); border: 1px solid rgba(35,84,164,.25); border-radius: var(--radius-sm); color: var(--blue-mid); font-family:'Cairo',sans-serif; font-size: 12.5px; font-weight: 700; text-decoration: none; }
.btn-maps:active { background: rgba(35,84,164,.18); }
.no-results { background: #fff8e1; border: 1px solid #ffe082; border-radius: var(--radius); padding: 20px; text-align: center; color: #6d4c00; }
.no-results .big { font-size: 36px; margin-bottom: 8px; }
.btn-reset { width: 100%; padding: 14px; background: linear-gradient(135deg, var(--blue-dark), var(--blue-mid)); color: #fff; border: none; border-radius: var(--radius-sm); font-family:'Cairo',sans-serif; font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 8px; }

/* ===== VACCINE CARDS (citizen) ===== */
.vx-card { background: #fff; border-radius: var(--radius); padding: 16px; margin-bottom: 12px; box-shadow: 0 2px 12px rgba(0,0,0,.07); border-right: 4px solid var(--green); cursor: pointer; display: flex; align-items: center; gap: 12px; width: 100%; text-align: right; font-family:'Cairo',sans-serif; border-top: 0; border-bottom: 0; border-left: 0; }
.vx-card:active { background: #fafbfe; }
.vx-emoji { font-size: 26px; flex-shrink: 0; }
.vx-name { font-size: 15px; font-weight: 800; color: var(--blue-dark); line-height: 1.35; }
.vx-en { font-size: 11.5px; color: var(--muted); margin-top: 2px; }
.vx-prot { font-size: 12px; color: #2e7d32; margin-top: 5px; line-height: 1.6; }
.vx-arrow { margin-right: auto; color: #c3c9d6; font-size: 18px; }

/* ===== DETAIL ===== */
.detail-hero { background: linear-gradient(135deg, var(--blue-dark), var(--blue-mid)); border-radius: var(--radius); padding: 18px 20px; color: #fff; margin-bottom: 14px; }
.detail-hero .big { font-size: 34px; }
.detail-hero h2 { font-size: 18px; font-weight: 900; margin-top: 6px; line-height: 1.35; }
.detail-hero p { font-size: 12.5px; opacity: .85; margin-top: 3px; }
.info-block { background: #fff; border-radius: var(--radius); padding: 16px 18px; margin-bottom: 12px; box-shadow: 0 2px 12px rgba(0,0,0,.06); }
.info-block h3 { font-size: 14.5px; font-weight: 800; color: var(--blue-dark); margin-bottom: 9px; display: flex; align-items: center; gap: 7px; }
.info-block .txt { font-size: 14px; line-height: 2; color: #33384a; white-space: pre-wrap; }
.spec-table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.spec-table th { background: #eef2f9; color: var(--blue-dark); font-weight: 700; text-align: right; padding: 10px 12px; width: 34%; vertical-align: top; border: 1px solid var(--line); white-space: nowrap; }
.spec-table td { padding: 10px 12px; border: 1px solid var(--line); line-height: 1.9; white-space: pre-wrap; color: #33384a; }
.warn-block { background: #fff8e1; border: 1px solid #ffe082; border-radius: var(--radius); padding: 16px 18px; margin-bottom: 12px; }
.warn-block h3 { font-size: 14.5px; font-weight: 800; color: #8a6100; margin-bottom: 8px; }
.warn-block .txt { font-size: 14px; line-height: 2; color: #6d4c00; white-space: pre-wrap; }
.dis-pill { display: inline-block; background: #eef6ff; border: 1px solid #c5ddf7; color: var(--blue-mid); padding: 5px 12px; border-radius: 20px; font-size: 12.5px; font-weight: 600; margin: 3px 3px 3px 0; }

/* ===== BOOK / GUIDE ===== */
.book-body { font-size: 14.5px; line-height: 2.05; color: #2e3344; }
.book-body h4 { font-size: 15.5px; font-weight: 800; color: var(--blue-dark); margin: 18px 0 8px; padding-right: 10px; border-right: 4px solid var(--blue-mid); }
.book-body p { margin-bottom: 10px; }
.book-body .bul { margin: 0 0 6px 0; padding-right: 6px; }
.book-body .note { background: #eef6ff; border-right: 4px solid var(--blue-mid); padding: 12px 14px; border-radius: 8px; margin: 12px 0; font-size: 14px; }
.book-body b { color: var(--blue-dark); }
.page-text { font-size: 14px; line-height: 2.05; color: #2e3344; white-space: pre-wrap; }
.page-sep { display: flex; align-items: center; gap: 10px; color: #aab1c0; font-size: 11.5px; margin: 20px 0 14px; }
.page-sep::before, .page-sep::after { content: ''; height: 1px; background: var(--line); flex: 1; }

.chk-item { display: flex; align-items: flex-start; gap: 10px; padding: 12px 4px; border-bottom: 1px solid var(--line); font-size: 14px; line-height: 1.8; cursor: pointer; }
.chk-item:last-child { border-bottom: 0; }
.chk-item input { width: 20px; height: 20px; accent-color: var(--green); flex-shrink: 0; margin-top: 3px; }
.chk-item.done span { color: var(--muted); text-decoration: line-through; }

.sch-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.sch-table th { background: var(--blue-dark); color: #fff; padding: 10px; font-weight: 700; }
.sch-table td { border: 1px solid var(--line); padding: 9px 11px; line-height: 1.8; vertical-align: top; }
.sch-table tr:nth-child(even) td { background: #f7f9fd; }
.sch-age { font-weight: 800; color: var(--blue-dark); white-space: nowrap; width: 30%; }

.src-note { font-size: 11.5px; color: var(--muted); text-align: center; margin-top: 18px; line-height: 1.9; }
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-thumb { background: #ccc; border-radius: 4px; }
</style>
</head>

## 2.1 معدات سلسلة التبريد
هناك ثلاث أنواع من معدات الدائرة الباردة لتخزين ونقل الطعوم في المستويات الطرفية:

**• ثلاجات مبطنة بقوالب ثلجية (ILR – Ice Lined Refrigerators):**
هذا النوع من الثلاجات تحتفظ بدرجة حرارة من +2 إلى +8 درجة مئوية لفترات طويلة في حالة انقطاع التيار الكهربائي.

**• صناديق التبريد (Cold Boxes):**
عبارة عن وعاء عازل للحرارة يمكن إحاطة جوانبه بقوالب ثلجية لحفظ الطعوم. مصمم للاستخدام على المدى القصير في نقل الطعوم من المخازن الرئيسية إلى الفرعية ومن الفرعية إلى حجرة التطعيم، وحفظ الطعوم في حالة تعطل الثلاجة أو أثناء إذابة الثلج المتراكم في المجمد أثناء النظافة، وكذلك حفظ الطعوم أثناء عمل الفرق المتحركة.

**• حاملات الطعوم (Vaccine Carriers):**
حامل الطعوم مثله مثل صندوق التبريد فهو وعاء عازل للحرارة ولكنه صغير في الحجم، ويستعمل في تخزين الطعوم أثناء جلسة التطعيم في المراكز الصحية.

## 2.2 حساسية الطعوم للحرارة
تعتبر كل الطعوم حساسة للحرارة ولكنها تختلف في مدى الحساسية للحرارة. ترتيب الطعوم حسب حساسيتها للحرارة:

**الأكثر حساسية للحرارة ← الأقل حساسية للحرارة:**
OPV ← Measles ← BCG ← IPV ← PCV ← Penta ← (DTP+HepB+Hib) ← TT ← Hepatitis B

**وبالعكس، الأقل حساسية للبرودة ← الأكثر حساسية للبرودة** بنفس الترتيب.

> **تذكـر:** جميع الطعوم التي تحتوي على "LETTE" (T) حساسة للتجميد — تتلف عند التجميد.
>
> كذلك هناك طعوم تتلف بالتجميد مثل: Rota, HPV, PCV13, Influenza

## 2.3 مؤشرات سلسلة التبريد
يجب أن يتم تخزين جميع الطعوم ما بين +2 إلى +8 درجة مئوية في جميع مراكز التطعيم الطرفية (المراكز الصحية ومواقع التطعيم)، ومراقبة درجة الحرارة للطعوم في معدات الدائرة الباردة أمر بالغ الأهمية لضمان الحفاظ على سلامة الطعوم حتى يتم إعطاؤها للمتلقي أو المستفيد.

هناك أنواع متعددة لمؤشرات سلسلة التبريد منها:

**• مؤشر الحرارة القرصي**

**• Stem Thermometer (مقياس الحرارة العصوي)**

**• مؤشر سلسلة التبريد (Vaccine Cold Chain Monitor):**
يتكون من نوافذ A,B,C,D وهي مؤشرات حساسة لارتفاع درجة الحرارة يتغير لونها بارتفاع درجة الحرارة ويكون التغيير تراكمياً (أي أنه غير قابل للتراجع) إذ تتحول النافذة من اللون الأبيض إلى اللون الأزرق.
- يستخدم في المصانع والمخازن الرئيسية والفرعية وعند نقل الطعوم.
- يبدأ عمل مؤشر سلسلة التبريد من لحظة سحب الشريط من النوافذ.
- إذا كانت جميع النوافذ A,B,C,D بيضاء اللون فبالإمكان استخدام جميع الطعوم بصورة طبيعية.
- إذا تغير لون النافذة A من الأبيض إلى الأزرق وبينما لا يزال لون النوافذ B,C,D أبيض اللون فيجب أن يستخدم طعم شلل الأطفال الفموي خلال ثلاثة أشهر بينما تستخدم بقية الطعوم بشكل طبيعي.
- إذا تغير لون النافذتين A,B إلى الأزرق بينما لا يزال لون النافذتين C,D أبيض: هنا لا يمكن استخدام طعم شلل الأطفال الفموي ويجب استخدام طعم الحصبة والمركب والحصبة والرباعي والخماسي خلال ثلاثة أشهر وتستخدم بقية الطعوم بشكل طبيعي.
- إذا تغير لون النوافذ A,B,C إلى الأزرق بينما لا يزال لون النافذة D أبيض: فلا يمكن استخدام طعم شلل الأطفال الفموي والحصبة والمركب والرباعي والخماسي، وبالإمكان استخدام الثلاثي البكتيري والطعم الواقي من مرض الدرن خلال ثلاثة أشهر وتستخدم بقية الطعوم بشكل طبيعي. (الوصول إلى هذه المرحلة يعني أن الطعوم تعرضت إلى درجة حرارة أكثر من 10 مئوية وأقل من 34 مئوية لفترة تتراوح ما بين 11-14 يوم).

**• مؤشر التجمد الإلكتروني (Freeze Tag):**
يستخدم لمراقبة الطعوم الحساسة للتجميد، حيث تظهر على الشاشة الإلكترونية علامة (✓) طالما لم يتعرض المؤشر إلى التجميد، وفي حالة التعرض للتجميد فسوف تظهر علامة (✗) على الشاشة الإلكترونية.

**• مرقاب درجة حرارة الثلاجة (Fridge Tag) يتميز بالتالي:**
- مراقبة درجة حرارة الثلاجة دون انقطاع.

- الحالة الرابعة: ❌ لا تستعمل (لون المربع أغمق من لون الدائرة)`

    body: `يجب تنظيم وترتيب جلسات التطعيم بطريقة تمكن كل المستهدفين من الحضور وتلقي الطعوم في أقل وقت ممكن، ويجب أن يشمل الإعداد لجلسات التطعيم على النقاط الآتية:

## أولاً: تحديد مواعيد جلسات التطعيم
يجب وضع جدول زمني بمواعيد جلسات التطعيم (يومياً أو أسبوعياً أو شهرياً) موضحاً الأعمار المستهدفة في كل جلسة بحيث يكون عدد المستفيدين مناسباً في الجلسة الواحدة، أي ليس بكبير جداً أو قليل جداً.

## ثانياً: التأكد من توفر الطعوم والمستلزمات الخاصة بالتطعيم
- قم بتوفير الطعوم والمذيب الخاص بها، على أن تقوم بفتح الثلاجة وأخذ العدد اللازم من عبوات الطعوم التي تحتاجها في الجلسة الحالية وذلك وفقاً لمستهدف الجلسة.
- قم بتوفير المستلزمات الخاصة بالتطعيم من:
  • حامل الطعوم والقوالب الثلجية اللازمة لذلك.
  • محاقن ذاتية العجز للخلط والحقن.
  • قطن لنظافة موضع الحقن.
  • صندوق المخلفات الآمن أو النفايات.
- قم بتوفير النماذج والسجلات الخاصة بالتسجيل.

## ثالثاً: تنظيم وترتيب المكان
إن الهدف من تنظيم وترتيب مكان جلسة التطعيم هو تسهيل مهمة العامل الصحي من أداء عمله لتطعيم المستهدفين في أقصر مدة زمنية وبطريقة صحيحة، كما أنه يجب أن يكون بالمركز الصحي مكان لانتظار المستفيدين ويجب أن يكون نظيفاً ومرتباً بطريقة تُرغب المستفيدين من الحضور والانتظام لمواصلة بقية الجرعات.`

    body: `يعتبر نظام التسجيل من أساسيات العمل في البرنامج وتكمن أهميته في مدى تطبيقه بشكل منتظم مما له الأثر في تقييم البرنامج الموسع للتطعيم من خلال تحليل واستخدام البيانات الروتينية التي يجمعها المشرفين والعاملين الصحيين على البرنامج الوطني للتطعيم، لمراقبة الأداء بشكل عام، وعلى وجه التحديد، لمعرفة معدلات التغطية بالطعوم ومعدلات التسرب منها.

## معدلات التغطية بالتطعيم
معدلات التغطية بالتطعيم هي نسبة عدد المطعمين من مجموع المستهدفين بالتطعيم. حيث إن في نهاية كل شهر، يجمع المشرفون عدد التطعيمات اليومية ويحولونها إلى نسبة مئوية تسمى التغطية.

**معدل التغطية = (مجموع عدد الأطفال الذين تم تطعيمهم بالجرعة الأولى من الطعم السداسي في العام) ÷ (عدد الأطفال الباقين على قيد الحياة الذين تقل أعمارهم عن 12 شهراً في نفس العام) × 100**

## معدلات التسرب (Drop-Out Rates)
قد تعكس معدلات التسرب المرتفعة مشاكل في الطلب على الطعوم، ومدى رضا المترددين عن الخدمات، وقدرة برنامج التحصين على توفير هذه الخدمات.

معدل التسرب هو معرفة عدد المستهدفين بالتطعيم الذين سبق وأن تلقوا خدمات التطعيم لجرعة ما ولكنهم لم يستكملوا باقي الجرعات المقررة في الوقت المحدد حسب الجدول الوطني للتطعيمات. فمثلاً إذا حضر الطفل لإخذ جرعات التطعيم بعد الولادة (BCG, HepB, OPV) ولم يعد لأخذ الجرعات الأخرى فإن هذا الطفل يعتبر من السواقط إذا لم يتم تطعيمه خلال شهر من تاريخ الجرعة المستحقة.

**معدل التسرب للجرعة الثالثة للطعم السداسي = (عدد المطعمين بالجرعة الأولى − عدد المطعمين بالجرعة الثالثة) ÷ (عدد المطعمين بالجرعة الأولى) × 100**

إذا بلغ معدل التسرب 10% أو أقل يعتبر مقبولاً، أما إذا تجاوز 10% فهذا يدل على وجود مشكلة عدم عودة الطفل لاستكمال جرعات التطعيم ويجب على مشرف التطعيمات والعاملين بالمركز الصحي مناقشة الموضوع والبحث عن الأسباب ووضع الحلول لهذه المشكلة.

## كيفية حساب نسب استخدام وهدر الطعوم على مستوى المركز الصحي
يُعرَّف استخدام الطعم بأنه نسبة الطعوم المستخدمة (التي تم إعطاؤها للطفل فعلاً) إلى نسبة الطعوم التي تم تجهيزها، ويُعرف الهدر على أنه نسبة الطعم الذي تم توفيره ولكن لا يتم استعماله مطلقاً، ويمكن القول على أنه فَقد أو خسارة الطعم مثل الكسر، انتهاء الصلاحية، التعرض للحرارة، التعرض للتجميد، التخلص من بقايا الجرعات في نهاية جلسة التطعيم، عدم مزج الطعم مع كمية المذيب المطلوبة وبالطريقة المناسبة … وغيرها.

**• نسبة الهدر = (عدد الجرعات المستلمة − عدد الجرعات المعطاة) ÷ (عدد الجرعات المستلمة) × 100**

**• الجرعات المستلمة** هي الجرعات التي تم استلمها من المخازن للاستخدام = (الرصيد المتبقي من الشهر الماضي + المُستلم خلال الشهر الحالي) − الرصيد المتبقي في نهاية الشهر

**• نسبة استخدام الطعم = 100 − نسبة الهدر للطعم**

**• عامل الهدر = 1 ÷ نسبة استخدام الطعم المئوية**

### مثال
استلم المركز الصحي (أ) عدد 2000 جرعة من طعم شلل الأطفال الفموي في شهر يناير، وتم تطعيم 1300 طفل خلال الشهر، علماً بأنه يوجد في المركز الصحي عدد 300 جرعة من نفس الطعم في بداية شهر يناير وفي نهاية الشهر وصل المخزون 600 جرعة.

**الجواب:**
- الجرعات المستلمة = (2000 + 300) − 600 = 1700
- نسبة الهدر = (1700 − 1300) ÷ 1700 × 100 = 24%
- نسبة استخدام الطعم = 100 − 24 = 76%
- عامل الهدر = 1 ÷ 0.76 = 1.31`
